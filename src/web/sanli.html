<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>某公司员工三力 · 数据看板</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--accent:#4f46e5;--accent2:#6366f1;--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--blue:#2563eb;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:10px;--font:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--kpi0:#4f46e5;--kpi1:#0891b2;--kpi2:#16a34a;--kpi3:#f59e0b;--kpi4:#dc2626;--kpi5:#7c3aed;--kpi6:#db2777;--kpi7:#0d9488}
.dark{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.container{max-width:1500px;margin:0 auto;padding:12px 20px}

/* board nav */
.board-nav{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.board-nav a{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;transition:all .15s}
.board-nav a:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.board-nav a.act{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 6px rgba(79,70,229,.3)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:14px}
header .title{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
header .title .dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
header .meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
header .meta span{white-space:nowrap}
header .meta b{color:var(--text)}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.act{background:var(--accent);color:#fff;border-color:var(--accent)}

/* refresh bar */
.refresh-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.refresh-bar select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px}
.countdown{font-variant-numeric:tabular-nums;min-width:28px;text-align:center;font-weight:700;color:var(--accent)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--accent);transition:transform .15s}
.kpi-card:hover{transform:translateY(-2px)}
.kpi-card .kpi-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi-card .kpi-val{font-size:26px;font-weight:800;line-height:1.1}
.kpi-card .kpi-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* filters */
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;padding:10px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.filter-bar label{font-size:13px;color:var(--muted);white-space:nowrap}
.filter-bar .chip-group{display:flex;flex-wrap:wrap;gap:5px}
.filter-bar .chip{padding:3px 10px;border-radius:14px;border:1px solid var(--border);font-size:12px;cursor:pointer;transition:all .15s;background:var(--card);color:var(--text);white-space:nowrap}
.filter-bar .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-bar select{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card);color:var(--text)}
.filter-bar input[type=text]{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card);color:var(--text);width:160px}

/* sections */
.section{margin-bottom:16px}
.section h2{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.section .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.chart-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.chart-card .ch{width:100%;height:380px}

/* tables */
.tbl-wrap{max-height:560px;overflow:auto;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
thead{position:sticky;top:0;z-index:2}
th{background:var(--accent);color:#fff;padding:8px 10px;cursor:pointer;text-align:left;white-space:nowrap;user-select:none;font-weight:600}
th:hover{background:var(--accent2)}
td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover td{background:rgba(79,70,229,.04)}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block}
.badge.pass{background:#dcfce7;color:#166534}
.badge.fail{background:#fee2e2;color:#991b1b}
.badge.skip{background:#f3f4f6;color:#6b7280}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.warn{background:#fef3c7;color:#92400e}
.dark .badge.pass{background:#14532d;color:#86efac}
.dark .badge.fail{background:#7f1d1d;color:#fca5a5}
.dark .badge.skip{background:#374151;color:#9ca3af}
.dark .badge.info{background:#1e3a8a;color:#bfdbfe}
.dark .badge.warn{background:#78350f;color:#fde68a}
.fcell{font-size:12px;line-height:1.5}
.fcell .std{color:var(--muted);font-size:11px}

/* toast */
.toast{position:fixed;top:20px;right:20px;z-index:9999;background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media print{header .dot{display:none}.refresh-bar{display:none}.filter-bar{display:none}.toast{display:none}body{background:#fff}.container{max-width:100%;padding:0}.chart-card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}

/* ---- 实时时钟 / 刷新倒计时（注入） ---- */
.live-wrap{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:12px;
  color:var(--muted,#6b7280);font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:middle}
.live-wrap b{font-weight:700;color:var(--fg,#1f2937);font-variant-numeric:tabular-nums}
.live-sep{opacity:.4}
.live-wrap .dot{width:6px;height:6px;border-radius:50%;background:#5e8a70;
  display:inline-block;animation:hzpulse 1s infinite}
@keyframes hzpulse{0%,100%{opacity:1}50%{opacity:.18}}

</style>
</head>
<body>
<div class="container">
<nav class="board-nav">
  <a href="index.html">📊 活动量看板</a>
  <a href="sanli.html" class="act">🏆 员工三力看板</a>
</nav>

<header>
  <div class="title">
    <span class="dot" id="live-dot"></span>
    某公司员工三力 · 在线数据看板
  </div>
  <div class="meta">
    <span>数据截至 <b id="meta-dt">--</b></span>
    <span>文件时间 <b id="meta-mt">--</b></span>
    <span style="font-size:11px;color:var(--muted)" id="meta-status">加载中...</span>
  </div>
</header>

<div class="refresh-bar">
  <label>自动刷新</label>
  <select id="sel-interval" onchange="setMyInterval()">
<option value="10">10 秒</option>
<option value="20" selected>20 秒</option>
<option value="30">30 秒</option>
<option value="60">60 秒</option>
<option value="0">关闭</option>
</select><span class="live-wrap"><span class="dot"></span><b id="live-clock">--:--:--</b><span class="live-sep">·</span><span>数据同步 <b id="live-dt">--:--:--</b></span><span class="live-sep">·</span><span id="live-rel">同步中…</span><span class="live-sep">·</span><span><b id="cd-live">--</b> 秒后刷新</span></span>
  <span class="countdown" id="countdown">5</span>
  <button class="btn sm" onclick="manualRefresh()">&#x21bb; 手动刷新</button>
  <button class="btn sm" id="btn-theme" onclick="toggleTheme()">🌙 深色</button>
  <button class="btn sm" onclick="exportCSV()">&#x2913; 导出 CSV</button>
  <button class="btn sm" onclick="window.print()">&#x1f5a8; 打印</button>
</div>

<div class="kpi-grid" id="kpi-grid"></div>

<div class="filter-bar" id="filter-bar">
  <label>事业部:</label>
  <div class="chip-group" id="chip-bu"></div>
  <span style="color:var(--muted);font-size:12px;margin:0 4px">|</span>
  <label>部门:</label>
  <select id="sel-dept" onchange="applyFilter()"><option value="">全部部门</option></select>
  <span style="color:var(--muted);font-size:12px;margin:0 4px">|</span>
  <label>有效人力:</label>
  <select id="sel-valid" onchange="applyFilter()">
    <option value="">全部</option>
    <option value="是">有效</option>
    <option value="否">无效</option>
    <option value="不考核">不考核</option>
  </select>
  <span style="color:var(--muted);font-size:12px;margin:0 4px">|</span>
  <label>搜索:</label>
  <input type="text" id="search-q" placeholder="搜索姓名 / 工号..." oninput="debounceSearch()">
  <button class="btn sm" onclick="clearSearch()" style="margin-left:4px">✕ 清除</button>
</div>

<!-- 员工三力明细 -->
<div class="section">
  <h2>👥 员工三力明细<span id="total-count" style="font-size:13px;font-weight:400;color:var(--muted);margin-left:10px"></span></h2>
  <div class="tbl-wrap"><table id="tbl-sanli"></table></div>
</div>

<!-- 各事业部三力等级人数 组合图 -->
<div class="section">
  <h2>📊 各事业部三力等级人数<span class="sub">组合图 · 蓝=破零人力 · 黄=标准人力 · 橙=英雄人力 · 灰=无效人力</span></h2>
  <div class="chart-card"><div class="ch" id="c_combo"></div></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/echarts.min.js"></script>
<script>
(function(){if(typeof echarts==='undefined'){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js';document.head.appendChild(s)}})();

var EMBEDDED_DATA=null;
(function(){var el=document.getElementById('embedded-data');if(el){try{EMBEDDED_DATA=JSON.parse(el.textContent)}catch(e){}}})();

/* R39（2026-09-23）：LIVE_URL 必须在主脚本块内声明。
   原先只声明在页尾「历史时间选择器」块，而主块 fetchData() 先于该块执行
   ⇒ ReferenceError: LIVE_URL is not defined ⇒ 主块中断 ⇒ 自动刷新永不启动。 */
var LIVE_URL='sanli_data.json';
var RAW=null,LAST_MTIME=0;
var charts={};
var state={bus:new Set(),dept:'',valid:'',q:'',auto:true,iv:60000,theme:'light'};
/* 主脚本默认加载是否成功触发（兜底用）。若主脚本在 fetchData 默认调用前异常中断，
   此标记保持 false，历史脚本初始化时会主动拉取最新数据，保证首屏即见最新数据集。 */
var _MAIN_LOADED=false;

try{var ts=localStorage.getItem('hzb-sanli-theme');if(ts==='dark'){state.theme='dark';document.body.classList.add('dark');document.getElementById('btn-theme').textContent='☀️ 浅色'}}catch(e){}

function fetchData(cb){
  function applyData(d){
    d._loaded=Date.now();
    var fresh = d.meta && d.meta.file_mtime_ts !== LAST_MTIME;
    if(d.meta&&d.meta.file_mtime_ts)LAST_MTIME=d.meta.file_mtime_ts;
    RAW=d;
    if(fresh&&LAST_MTIME)toast('数据已刷新 ✓');
    if(cb)cb();
  }
  fetch(LIVE_URL).then(function(r){return r.json()}).then(applyData)
    .catch(function(e){if(EMBEDDED_DATA)applyData(EMBEDDED_DATA);else console.error(e)});
}

function fmtNum(v){if(v==null)return'--';if(typeof v==='number')return v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2);return v}
function fmtMoney(v){if(v==null)return'--';if(typeof v!=='number')return fmtNum(v);var neg=v<0;var a=Math.abs(v);var s=a>=1000?a.toLocaleString('zh-CN',{maximumFractionDigits:0}):(a>=100?a.toFixed(0):a>=10?a.toFixed(1):a.toFixed(2));return (neg?'-':'')+s}
function shortName(s){return (s||'').replace('<CITY>','').replace('事业部','').replace('业务','').replace('部门','')}

function renderAll(){
  if(!RAW)return;
  buildFilters();
  var r=computeFiltered();
  renderKPIs(r);
  renderTable(r);
  renderCombo(r);
  updateMeta();
}

function buildFilters(){
  var bus=new Set();
  RAW.employees.forEach(function(e){if(e.事业部)bus.add(e.事业部)});
  var html='';
  bus.forEach(function(b){if(!b)return;
    html+='<span class="chip'+(state.bus.has(b)?' on':'')+'" onclick="toggleBu(\''+b.replace(/'/g,"\\'")+'\')">'+shortName(b)+'</span>';
  });
  document.getElementById('chip-bu').innerHTML=html+'<span class="chip" onclick="clearBu()">↺ 重置</span>';
  var depts=new Set(),sel=document.getElementById('sel-dept');
  RAW.employees.forEach(function(e){if(e.部门)depts.add(e.部门)});
  sel.innerHTML='<option value="">全部部门</option>';
  depts.forEach(function(d){sel.innerHTML+='<option value="'+d+'">'+d+'</option>'});
  sel.value=state.dept;
  document.getElementById('sel-valid').value=state.valid;
}
function toggleBu(b){state.bus.has(b)?state.bus.delete(b):state.bus.add(b);applyFilter()}
function clearBu(){state.bus.clear();applyFilter()}
function applyFilter(){
  state.dept=document.getElementById('sel-dept').value;
  state.valid=document.getElementById('sel-valid').value;
  state.q=document.getElementById('search-q').value.trim();
  renderAll();
}
var _st=null;function debounceSearch(){clearTimeout(_st);_st=setTimeout(applyFilter,250)}
function clearSearch(){document.getElementById('search-q').value='';applyFilter()}

function computeFiltered(){
  var bus=state.bus,dept=state.dept,valid=state.valid,q=state.q;
  var fBus=RAW.bus.filter(function(b){return bus.size===0||bus.has(b.事业部)});
  var fEmp=RAW.employees.filter(function(e){
    if(bus.size>0&&!bus.has(e.事业部))return false;
    if(dept&&e.部门!==dept)return false;
    if(valid&&e.是否有效人力!==valid)return false;
    if(q&&e.姓名.indexOf(q)<0&&e.工号.indexOf(q)<0)return false;
    return true;
  });
  return {bus:fBus,employees:fEmp};
}

function renderKPIs(r){
  var s=RAW.summary;
  var lv=s.等级||{};
  var cards=[
    {l:'员工总人数',v:RAW.total,sub:'共 '+RAW.bus.length+' 个事业部',c:'var(--kpi0)'},
    {l:'英雄人力',v:lv['英雄人力']||0,sub:'达成英雄值',c:RAW.level_colors['英雄人力']},
    {l:'标准人力',v:lv['标准人力']||0,sub:'达成标准值',c:RAW.level_colors['标准人力']},
    {l:'破零人力',v:lv['破零人力']||0,sub:'达成破零值',c:RAW.level_colors['破零人力']},
    {l:'无效人力',v:lv['无效人力']||0,sub:'未破零',c:RAW.level_colors['无效人力']},
    {l:'有效人力',v:s.有效人力||0,sub:'是否有效人力=是',c:'var(--kpi5)'},
    {l:'快照时间',v:(RAW.meta.data_time||'').slice(-8)||'--',sub:(RAW.meta.file_mtime||'').slice(11)||'--',c:'var(--kpi7)'}
  ];
  var html='';
  cards.forEach(function(c){html+='<div class="kpi-card" style="border-left-color:'+c.c+'"><div class="kpi-label">'+c.l+'</div><div class="kpi-val" style="color:'+c.c+'">'+c.v+'</div><div class="kpi-sub">'+c.sub+'</div></div>'});
  document.getElementById('kpi-grid').innerHTML=html;
}

function initOrGet(id){if(!charts[id])charts[id]=echarts.init(document.getElementById(id));charts[id].clear();return charts[id]}

// 各事业部三力等级人数 组合图（堆叠柱）
function renderCombo(r){
  var cats=r.bus.map(function(b){return shortName(b.事业部)});
  // 底→顶：无效 → 破零 → 标准 → 英雄
  var order=(RAW.levels||['英雄人力','标准人力','破零人力','无效人力']).slice().reverse();
  var series=order.map(function(lv){
    return {
      name:lv,type:'bar',stack:'x',
      data:r.bus.map(function(b){return (b.等级&&b.等级[lv])||0}),
      itemStyle:{color:RAW.level_colors[lv]||'#999'},
      label:{show:true,position:'inside',formatter:function(p){return p.value>0?p.value:''},color:'#fff',fontWeight:700}
    };
  });
  var opt={
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},
      formatter:function(ps){var total=0;var html=ps[0].name;ps.forEach(function(p){total+=p.value});html+='<br/>总计 <b>'+total+'</b> 人';ps.forEach(function(p){if(p.value>0)html+='<br/>'+p.marker+p.seriesName+' <b>'+p.value+'</b> 人'});return html}},
    legend:{bottom:0,textStyle:{color:state.theme==='dark'?'#94a3b8':'#666'}},
    grid:{left:120,right:20,top:20,bottom:40},
    xAxis:{type:'value',splitLine:{lineStyle:{color:state.theme==='dark'?'#334155':'#e5e7eb'}},minInterval:1},
    yAxis:{type:'category',data:cats,inverse:true,axisLabel:{fontSize:11}},
    series:series
  };
  initOrGet('c_combo').setOption(opt);
}

function forceCell(f,emp){
  var o=emp.三力[f];
  var b='';
  if(o.状态==='达成')b='<span class="badge pass">达成</span>';
  else if(o.状态==='未达成')b='<span class="badge fail">未达成</span>';
  else b='<span class="badge skip">未设</span>';
  var std=o.标准!=null?fmtMoney(o.标准):'—';
  var gap=o.差距!=null?fmtMoney(o.差距):'—';
  return '<div class="fcell">'+b+'<div class="std">标准 '+std+' · 差距 '+gap+'</div></div>';
}

function validBadge(v){
  if(v==='是')return '<span class="badge pass">有效</span>';
  if(v==='否')return '<span class="badge fail">无效</span>';
  if(v==='不考核')return '<span class="badge warn">不考核</span>';
  return v||'--';
}

function renderTable(r){
  var emps=r.employees.slice().sort(function(a,b){return (a.事业部||'').localeCompare(b.事业部||'','zh')||(a.部门||'').localeCompare(b.部门||'','zh')});
  var html='<thead><tr>';
  html+='<th>姓名</th><th>事业部</th><th>部门</th><th>状态</th><th>岗龄</th><th>有效人力</th><th>业绩</th>';
  RAW.forces.forEach(function(f){html+='<th>'+f+'</th>'});
  html+='</tr></thead><tbody>';
  if(emps.length===0){html+='<tr><td colspan="'+(7+RAW.forces.length)+'" style="text-align:center;color:var(--muted);padding:24px">无匹配结果</td></tr>';}
  else{
    emps.forEach(function(e){
      var stb=e.状态==='试用'?'<span class="badge warn">试用</span>':(e.状态==='正式'?'<span class="badge info">正式</span>':e.状态||'--');
      html+='<tr><td><b>'+e.姓名+'</b><div class="std" style="color:var(--muted);font-size:11px">'+e.工号+'</div></td>';
      html+='<td>'+shortName(e.事业部)+'</td><td>'+e.部门+'</td><td>'+stb+'</td><td>'+e.岗龄+'</td><td>'+validBadge(e.是否有效人力)+'</td><td>'+fmtMoney(e.业绩)+'</td>';
      RAW.forces.forEach(function(f){html+='<td>'+forceCell(f,e)+'</td>'});
      html+='</tr>';
    });
  }
  html+='</tbody>';
  document.getElementById('tbl-sanli').innerHTML=html;
  document.getElementById('total-count').textContent='显示 '+emps.length+' / '+(RAW.employees||[]).length+' 人';
}

function updateMeta(){
  document.getElementById('meta-dt').textContent=RAW.meta.data_time||'--';
  document.getElementById('meta-mt').textContent=(RAW.meta.file_mtime||'').slice(11)||'--';
  document.getElementById('meta-status').textContent='就绪 · '+(state.auto?'自动刷新中':'手动模式');
}

var countdownTimer=null,countdownVal=state.iv/1000;
function startRefresh(){
  clearInterval(countdownTimer);clearInterval(window.__pollTimer);
  if(state.auto&&state.iv>0){
    countdownVal=state.iv/1000;

  if (date) { b.style.display = 'block'; b.innerHTML = '📅 正在查看历史：<b>' + date + '</b>（非实时数据）'; }
  else { b.style.display = 'none'; }
}
function loadDate(date) {
  if (!date) return;
  var ym = date.slice(0, 7);
  var url = 'hist/' + HIST_BASE + '/' + ym + '/' + date + '.json';
  fetch(url).then(function (r) { if (!r.ok) throw new Error('404'); return r.json(); })
    .then(function (d) { RAW = d; D = d; VIEWING_HISTORY = true; _histCur = date; setHistBanner(date); renderAll(); })
    .catch(function (e) { alert('该日期无快照：' + date); });
}
function exitHistory() {
  VIEWING_HISTORY = false; _histCur = null; setHistBanner(null);
  if (typeof loadData === 'function') loadData();
  else if (typeof fetchData === 'function') fetchData(renderAll);
}
function loadHistManifest(cb) {
  fetch('hist/manifest.json').then(function (r) { return r.json(); }).then(function (m) { cb(m); })
    .catch(function (e) { cb(null); });
}
var _histManifest = null;

/* 按月度目录展示：月份下拉 → 该月所有可用日期 → 点某天即显示 */
function renderHistMonth() {
  var sel = document.getElementById('histMonth');
  var box = document.getElementById('histChips');
  var ym = sel && sel.value;
  if (!ym) { box.innerHTML = '<span style="color:#888">请选择月份</span>'; return; }
  loadHistManifest(function (m) {
    if (!m) { box.innerHTML = '<span style="color:#b00">历史清单加载失败</span>'; return; }
    _histManifest = m;
    var dates = (m.modules && m.modules[HIST_BASE]) || [];
    var list = dates.filter(function (d) { return d.slice(0, 7) === ym; }).sort();
    _fillHistMonths(m);
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<span style="color:#888">该月无快照</span>'; return; }
    list.forEach(function (d) {
      var dt = ''; try { dt = m.data_time[HIST_BASE][d]; } catch (_) {}
      var chip = document.createElement('span');
      chip.className = 'hist-chip' + (d === _histCur ? ' on' : '');
      chip.textContent = d.slice(8) + '日' + (dt ? (' · ' + dt) : '');
      chip.title = d;
      chip.onclick = function () { _histCur = d; loadDate(d); renderHistMonth(); };
      box.appendChild(chip);
    });
  });
}

function _fillHistMonths(m) {
  var sel = document.getElementById('histMonth');
  if (!sel) return;
  var dates = (m.modules && m.modules[HIST_BASE]) || [];
  var months = {};
  dates.forEach(function (d) { months[d.slice(0, 7)] = 1; });
  var keys = Object.keys(months).sort().reverse();
  var cur = sel.value;
  var html = '';
  keys.forEach(function (k) {
    var cnt = dates.filter(function (d) { return d.slice(0, 7) === k; }).length;
    html += '<option value="' + k + '">' + k + '（' + cnt + ' 天）</option>';
  });
  if (html) sel.innerHTML = html;
  if (cur && keys.indexOf(cur) >= 0) sel.value = cur;
  else if (keys.length) sel.value = keys[0];
}
function toggleHist() {
  var p = document.getElementById('histPanel');
  var open = (p.style.display === 'block');
  p.style.display = open ? 'none' : 'block';
  if (!open) renderHistMonth();
}
function initHistoryBar() {
  if (document.getElementById('histBar')) return;
  var css = ''
    + '.hist-chip{display:inline-block;padding:4px 10px;margin:3px;border:1px solid #ddd;border-radius:14px;cursor:pointer;font-size:12px;background:#fff;color:#333}'
    + '.hist-chip:hover{background:#eef}.hist-chip.on{background:#4f46e5;color:#fff;border-color:#4f46e5}'
    + '#histBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff7e6;border-bottom:1px solid #f0c36d;color:#8a6d3b;text-align:center;padding:6px;font-size:13px}'
    + '#histBar{position:fixed;top:10px;right:12px;z-index:99999;font-size:14px}'
    + '#histBar .hb-btn{background:#4f46e5;color:#fff;border:2px solid #fff;border-radius:22px;padding:9px 18px;cursor:pointer;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(79,70,229,.45)}'
    + '#histBar .hb-btn:hover{background:#4338ca}'
    + '#histPanel{display:none;position:fixed;top:46px;right:8px;z-index:9999;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.15);width:300px}'
    + '#histPanel label{display:block;margin:6px 0 2px;color:#555}'
    + '#histPanel select{width:100%;padding:6px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;font-size:13px}'
    + '#histPanel .row{display:flex;gap:8px;margin-top:8px}'
    + '#histPanel .row button{flex:1;border:none;border-radius:6px;padding:7px;cursor:pointer;font-weight:600}'
    + '#histPanel .hint{color:#888;font-size:12px;margin-top:6px}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  var banner = document.createElement('div'); banner.id = 'histBanner'; document.body.appendChild(banner);
  var bar = document.createElement('div'); bar.id = 'histBar';
  bar.innerHTML = '<button class="hb-btn" onclick="toggleHist()">📅 历史</button>';
  document.body.appendChild(bar);
  var panel = document.createElement('div'); panel.id = 'histPanel';
  panel.innerHTML = '<label>选择月份</label><select id="histMonth" onchange="renderHistMonth()"></select>'
    + '<div id="histChips" style="margin-top:8px"></div>'
    + '<div class="hint">点击某天即可查看当天历史数据</div>'
    + '<div class="row"><button style="background:#eee;color:#333" onclick="exitHistory()">返回最新</button></div>';
  document.body.appendChild(panel);
  loadHistManifest(function (m) { if (m) { _histManifest = m; _fillHistMonths(m); renderHistMonth(); } });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initHistoryBar);
else initHistoryBar();

/* ===== 兜底：默认直接展示最新数据（需求 M-5）=====
   确保「未应用任何历史筛选」时首屏即渲染最新数据集，无需用户操作。
   仅当主脚本默认加载未成功触发（_MAIN_LOADED=false，可能因前置异常中断）时，
   主动拉取最新数据；历史查看态（VIEWING_HISTORY）下不触发，避免与 loadDate 冲突。 */
(function () {
  try {
    if (VIEWING_HISTORY) return;
    if (typeof _MAIN_LOADED !== 'undefined' && _MAIN_LOADED) return;
    if (typeof loadData === 'function') loadData();
    else if (typeof fetchData === 'function') fetchData(renderAll);
  } catch (e) {}
})();

/* ===== 缓存自愈：若本页 HTML 是被浏览器缓存的旧版（无历史按钮），自动强刷一次 ===== */
(function(){
  try {
    var SELF = 'sanli_data.json';
    var key = 'hzHistSelfHeal_v1_' + SELF;
    if (!document.getElementById('histBar') && !sessionStorage.getItem(key)) {
      sessionStorage.setItem(key, '1');
      fetch('_build_fingerprint.json?t=' + Date.now(), {cache:'no-store'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(fp){
          if (fp && fp.build_hash) { location.reload(true); }
        }).catch(function(){ location.reload(true); });
    }
  } catch(e) {}
})();
</script>

<script>
/* ---- 实时时钟 / 刷新倒计时 / 同步于x秒前（注入） ---- */
(function(){
  var CD={last:Date.now()};
  function pad(n){return (n<10?'0':'')+n;}
  function hms(d){return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
  function hook(){
    if(window.fetch){
      var f=window.fetch;
      window.fetch=function(){
        var r=f.apply(this,arguments);
        try{ r && r.then && r.then(function(){CD.last=Date.now();}); }catch(e){}
        return r;
      };
    }
    if(window.XMLHttpRequest){
      var O=XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open=function(){
        try{ this.addEventListener('load',function(){CD.last=Date.now();}); }catch(e){}
        return O.apply(this,arguments);
      };
    }
  }
  function ivSec(){
    var s=document.getElementById('sel-interval');
    var v=s?parseInt(s.value,10):0;
    return v>0?v:0;
  }
  function relTxt(ts){
    var s=Math.max(0,Math.round((Date.now()-ts)/1000));
    if(s<60) return s+' 秒前同步';
    var m=Math.floor(s/60);
    if(m<60) return m+' 分钟前同步';
    return Math.floor(m/60)+' 小时前同步';
  }
  function tick(){
    var el,iv;
    if((el=document.getElementById('live-clock'))) el.textContent=hms(new Date());
    iv=ivSec();
    if((el=document.getElementById('cd-live'))){
      if (window.VIEWING_HISTORY) { el.textContent = '已暂停'; }
      else { el.textContent = iv ? Math.max(0,Math.ceil((CD.last+iv*1000-Date.now())/1000)) : '—'; }
    }
    if((el=document.getElementById('live-rel'))) el.textContent = window.VIEWING_HISTORY ? '历史查看中' : relTxt(CD.last);
    if((el=document.getElementById('live-dt'))){
      el.textContent = hms(new Date(CD.last));
    }
  }
  hook(); tick(); setInterval(tick,1000);
})();
</script>

<script id="visitlog-inject">
(function(){
  var API='https://hzdash-d6gn9drv3691d93a1.service.tcloudbase.com/visit';
  var KEY='hz-vis-2026';
  var PAGE=(location.pathname||'/')+(location.search||'');
  /* 页面加载后错峰上报一次（fail-silent，不阻塞渲染） */
  setTimeout(function(){
    try{
      fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({page:PAGE}),keepalive:true}).catch(function(){});
    }catch(e){}
  },Math.floor(Math.random()*600)+300);

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var PAGE_NAMES={'/':'导航页','/dash/':'活动量看板','/dash/index.html':'活动量看板',
    '/dash/sanli.html':'三力看板','/dash/ry.html':'网销看板','/dash/ry_dy.html':'电邀看板',
    '/dash/ry_kuaiji.html':'会计看板','/index.html':'活动量看板','/sanli.html':'三力看板',
    '/ry.html':'网销看板'};
  function pageName(p){p=String(p||'');var q=p.indexOf('?');if(q>=0)p=p.slice(0,q);
    return PAGE_NAMES[p]||p;}
  function fmtDate(d){var p=function(n){return n<10?'0'+n:''+n};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
  function today(){return fmtDate(new Date())}
  function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return fmtDate(d)}
  function pp(v,max){if(!max)max=v;var w=Math.max(2,Math.round(v/max*64));
    return '<span class="vl-bar-cell" style="width:'+w+'px"></span>';}

  function load(start,end){
    $('vlBody').innerHTML='<div id="vlLoading">加载中…</div>';
    $('vlMsg').textContent='';
    fetch(API+'?start='+start+'&end='+end+'&key='+encodeURIComponent(KEY))
      .then(function(r){return r.json()})
      .then(function(j){
        if(!j||!j.ok){throw new Error((j&&j.error)||'查询失败');}
        render(start,end,j);
      })
      .catch(function(e){
        $('vlBody').innerHTML='<div id="vlErr">查询失败：'+esc(e.message||e)+'</div>';
      });
  }
  function render(start,end,j){
    var h='';
    h+='<div class="vl-sum">'
      +'<div class="vl-kpi"><div class="vl-k">'+(start===end?'今日':'区间')+'访问次数（PV）</div><div class="vl-v">'+j.total.pv+'</div></div>'
      +'<div class="vl-kpi"><div class="vl-k">独立 IP 数（UV）</div><div class="vl-v">'+j.total.ip+'</div></div>'
      +'<div class="vl-kpi"><div class="vl-k">统计区间</div><div class="vl-v" style="font-size:14px;line-height:2">'+start+' ~ '+end+'</div></div>'
      +'</div>';
    var i,maxPv;
    h+='<div class="vl-sec">🗺️ 区域分布（按访问次数）</div>';
    if(j.regions.length){
      maxPv=j.regions[0].pv;
      h+='<table class="vl-tbl"><tr><th>#</th><th>IP 区域</th><th>访问次数</th><th></th><th>独立 IP</th></tr>';
      for(i=0;i<j.regions.length;i++){
        h+='<tr><td>'+(i+1)+'</td><td>'+esc(j.regions[i].k)+'</td>'
          +'<td class="vl-num">'+j.regions[i].pv+'</td><td>'+pp(j.regions[i].pv,maxPv)+'</td>'
          +'<td class="vl-num">'+j.regions[i].ip+'</td></tr>';
      }
      h+='</table>';
    }else{h+='<div style="color:#8a94a6">该区间暂无访问记录</div>';}
    if(j.days.length){
      h+='<div class="vl-sec">📅 按日汇总</div>';
      maxPv=Math.max.apply(null,j.days.map(function(d){return d.pv}));
      h+='<table class="vl-tbl"><tr><th>日期</th><th>访问次数</th><th></th><th>独立 IP</th></tr>';
      for(i=0;i<j.days.length;i++){
        h+='<tr><td>'+esc(j.days[i].k)+'</td><td class="vl-num">'+j.days[i].pv+'</td>'
          +'<td>'+pp(j.days[i].pv,maxPv)+'</td><td class="vl-num">'+j.days[i].ip+'</td></tr>';
      }
      h+='</table>';
    }
    if(j.list.length){
      h+='<div class="vl-sec">🕓 最近访问明细（最多 300 条）</div>';
      h+='<table class="vl-tbl"><tr><th>时间</th><th>IP</th><th>区域</th><th>页面</th></tr>';
      for(i=0;i<j.list.length;i++){
        var it=j.list[i];
        h+='<tr><td>'+esc(it.date)+' '+esc(it.time)+'</td><td>'+esc(it.ip)+'</td>'
          +'<td>'+esc(it.region)+'</td><td>'+esc(pageName(it.page))+'</td></tr>';
      }
      h+='</table>';
    }
    $('vlBody').innerHTML=h;
    $('vlMsg').textContent='共 '+j.total.pv+' 次 · '+j.total.ip+' 个 IP';
  }

  function openPanel(){
    $('vlMask').style.display='flex';
    $('vlStart').value=today();
    $('vlEnd').value=today();
    load(today(),today());
  }
  function closePanel(){$('vlMask').style.display='none';}

  $('vlBtn').addEventListener('click',openPanel);
  $('vlClose').addEventListener('click',closePanel);
  $('vlMask').addEventListener('click',function(e){if(e.target===$('vlMask'))closePanel();});
  $('vlGo').addEventListener('click',function(){
    var s=$('vlStart').value,e=$('vlEnd').value;
    if(!s||!e||s>e){$('vlMsg').textContent='请选择有效日期区间';return;}
    load(s,e);
  });
  $('vlToday').addEventListener('click',function(){
    $('vlStart').value=today();$('vlEnd').value=today();load(today(),today());});
  $('vl7').addEventListener('click',function(){
    $('vlStart').value=daysAgo(6);$('vlEnd').value=today();load($('vlStart').value,today());});
  $('vl30').addEventListener('click',function(){
    $('vlStart').value=daysAgo(29);$('vlEnd').value=today();load($('vlStart').value,today());});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});
})();
</script>
