<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售通话质检分析报告</title>
<style>
  :root{
    --p-deep:#26215C; --p-main:#534AB7; --p-light:#6C63D0;
    --bg:#f4f5fb; --card:#fff; --border:#e7e7f0; --muted:#8a8aa3;
    --ink:#23233a; --green:#2e9e5b; --yellow:#e0a200; --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  a{color:inherit}
  /* ===== 侧边栏 ===== */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:linear-gradient(180deg,var(--p-deep),var(--p-main));color:#fff;padding:26px 0;display:flex;flex-direction:column;z-index:20}
  .sidebar .brand{padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
  .sidebar .brand .t{font-size:17px;font-weight:800;letter-spacing:.5px}
  .sidebar .brand .s{font-size:12px;opacity:.7;margin-top:4px}
  .nav-item{padding:14px 22px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.82);border-left:4px solid transparent;transition:.15s}
  .nav-item:hover{background:rgba(255,255,255,.10);color:#fff}
  .nav-item.active{background:rgba(255,255,255,.16);border-left-color:var(--p-light);color:#fff}
  .nav-item .em{font-size:16px}
  .sidebar .foot{margin-top:auto;padding:16px 22px;font-size:11px;opacity:.55;border-top:1px solid rgba(255,255,255,.12)}
  /* ===== 主区 ===== */
  .main{margin-left:220px;padding:30px 36px 60px;min-height:100vh}
  header.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px}
  header.topbar h1{font-size:24px;font-weight:800;color:var(--p-deep)}
  header.topbar .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted)}
  .badge b{color:var(--p-main)}
  .section{display:none;animation:fade .25s ease}
  .section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-title{font-size:18px;font-weight:800;color:var(--p-deep);margin:6px 0 16px;display:flex;align-items:center;gap:10px}
  .sec-title::before{content:"";width:5px;height:18px;background:var(--p-light);border-radius:3px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(40,33,92,.05)}
  .card + .card{margin-top:18px}
  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:16px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(40,33,92,.05)}
  .kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--p-main),var(--p-light));opacity:.10}
  .kpi .lab{font-size:13px;color:var(--muted);font-weight:600}
  .kpi .num{font-size:30px;font-weight:800;color:var(--p-deep);margin-top:8px;line-height:1}
  .kpi .unit{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
  .kpi .delta{font-size:12px;margin-top:8px;color:var(--muted)}
  .kpi .delta b{color:var(--green)}
  /* ===== 录音质检（库） ===== */
  .rec-stat{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .stat-pill{background:#fff;border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:13px;color:#555}
  .stat-pill b{color:var(--p-main);font-weight:800}
  .rec-filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:18px}
  .rec-filters label{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .rec-filters select,.rec-filters input{font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
  .rec-filters .grow{flex:1 1 180px}
  .rec-filters .grow input{width:100%}
  .rec-cnt{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
  .rec-layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  .rec-list{display:flex;flex-direction:column;gap:10px;max-height:74vh;overflow-y:auto;padding-right:4px}
  .rec-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s}
  .rec-item:hover{border-color:var(--p-light);box-shadow:0 2px 10px rgba(40,33,92,.08)}
  .rec-item.active{border-color:var(--p-main);background:linear-gradient(135deg,#f6f4ff,#fff);box-shadow:0 4px 14px rgba(83,74,183,.14)}
  .rec-item .ri-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rec-item .ri-person{font-weight:800;color:var(--p-deep);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
  .rec-item .ri-dur{font-size:12px;font-weight:800;color:var(--p-main);background:#f1eefc;border-radius:20px;padding:2px 10px;flex:0 0 auto}
  .rec-item .ri-meta{font-size:12px;color:var(--muted);margin-top:6px}
  .rec-item .ri-src{display:inline-block;font-size:11px;color:#6c63d0;background:#efeafd;border-radius:6px;padding:1px 7px;margin-top:5px}
  /* 详情 */
  .rec-detail .rd-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .rec-detail .rd-title{font-size:20px;font-weight:800;color:var(--p-deep);line-height:1.3}
  .rec-detail .rd-meta{font-size:13px;color:var(--muted);margin-top:6px}
  .rec-detail .rd-overall{text-align:center;background:linear-gradient(135deg,#26215C,#534AB7);color:#fff;border-radius:14px;padding:12px 20px;min-width:110px}
  .rec-detail .rd-overall .ov{font-size:24px;font-weight:800;line-height:1}
  .rec-detail .rd-overall .ovl{font-size:12px;opacity:.8;margin-top:4px}
  .player-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#f7f6ff;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .player-bar audio{height:40px;flex:1;min-width:240px}
  .audio-link{font-size:12px;color:var(--p-main);font-weight:700;text-decoration:none;border:1px solid var(--p-light);border-radius:8px;padding:7px 12px;white-space:nowrap}
  .audio-link:hover{background:var(--p-light);color:#fff}
  /* 五维评分（占位） */
  .score-row{margin-bottom:14px}
  .score-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .score-name{font-weight:700;color:var(--p-deep);font-size:14px}
  .score-val{font-weight:800;font-size:14px;color:var(--muted)}
  .score-track{height:9px;background:#eceaf8;border-radius:6px;overflow:hidden}
  .score-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p-light),var(--p-main))}
  .score-comment{font-size:12px;color:var(--muted);margin-top:4px}
  .demo-note{font-size:12px;color:#b8860b;background:#fff8e6;border:1px solid #ffe2a0;border-radius:8px;padding:8px 12px}
  /* 质检结论 + 雷达 */
  .qa-grid{display:grid;grid-template-columns:1fr 240px;gap:18px;align-items:center}
  .radar-box{display:flex;justify-content:center;align-items:center;background:#faf9ff;border:1px solid var(--border);border-radius:12px;padding:8px}
  .radar-wrap{text-align:center}
  .qa-sub{font-size:13px;font-weight:800;color:var(--p-deep);margin:14px 0 8px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;border-radius:20px;padding:4px 12px;background:#f1eefc;color:var(--p-deep)}
  .tag-ok{background:#e6f6ec;color:#2e9e5b;border:1px solid #bfe6cd}
  .tag-bad{background:#fdeceb;color:#d9534f;border:1px solid #f3c6c2}
  .sug-box{background:#faf9ff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .sug-item{font-size:13px;line-height:1.6;color:#444;margin-bottom:8px}
  .sug-item:last-child{margin-bottom:0}
  /* ===== 五维质检结论（概览-电邀规划师） ===== */
  .qa-title{font-size:15px;font-weight:800;color:var(--p-deep);margin:30px 0 14px;display:flex;align-items:center;gap:9px}
  .qa-title::before{content:"";width:5px;height:16px;background:var(--p-light);border-radius:3px}
  .qa-note{font-size:12.5px;color:var(--muted);margin-left:auto;font-weight:500}
  .agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
  .agent-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(40,33,92,.05)}
  .ac-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .ac-name{font-size:17px;font-weight:800;color:var(--p-deep)}
  .ac-cnt{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
  .ac-ov{font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,#26215C,#534AB7);border-radius:20px;padding:5px 14px;white-space:nowrap}
  .ac-block{margin-top:13px}
  .ac-label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .ac-label .dot{width:7px;height:7px;border-radius:50%;background:var(--p-light)}
  .ac-tags{display:flex;flex-wrap:wrap;gap:7px}
  .veto-item{display:flex;gap:8px;align-items:flex-start;background:#fdeceb;border:1px solid #f3c6c2;border-radius:9px;padding:8px 11px;margin-bottom:7px;font-size:12.5px;color:#c0392b;line-height:1.45}
  .veto-item .vt-cnt{font-weight:800;background:#c0392b;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;flex:0 0 auto;margin-top:1px}
  .ac-sug{font-size:12.5px;line-height:1.6;color:#444;background:#faf9ff;border:1px solid var(--border);border-radius:9px;padding:10px 12px}
  .ac-sug b{color:var(--p-main)}
  /* ===== 电邀规划师五维对比 ===== */
  .cmp-legend{display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 18px}
  .cmp-leg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#45455f}
  .cmp-leg .sw{width:14px;height:14px;border-radius:4px}
  .cmp-leg .ov{font-weight:800;color:#23233a;margin-left:4px}
  .cmp-charts{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  @media(max-width:860px){.cmp-charts{grid-template-columns:1fr}}
  .cmp-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
  .cmp-table th,.cmp-table td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border)}
  .cmp-table th{background:#f6f5fc;color:var(--p-deep);font-weight:800}
  .cmp-table td:first-child{text-align:left;font-weight:700;color:#45455f}
  .cmp-table .cell{display:inline-block;min-width:40px;font-weight:800;border-radius:8px;padding:3px 0}
  .cmp-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}
  .cmp-scard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
  .cmp-scard h4{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .cmp-scard .dot{width:10px;height:10px;border-radius:50%}
  .cmp-scard p{font-size:12.5px;line-height:1.7;color:#555}
  /* 逐句气泡 */
  .bubbles{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding-right:4px}
  .bubble{display:flex;gap:12px;align-items:flex-start;background:#f7f6ff;border:1px solid var(--border);border-radius:10px;padding:9px 13px;cursor:pointer;transition:.12s}
  .bubble:hover{border-color:var(--p-light);background:#f1eefc}
  .bubble.playing{border-color:var(--p-main);background:linear-gradient(135deg,#f6f4ff,#fff);box-shadow:0 2px 10px rgba(83,74,183,.15)}
  .b-time{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--p-main);font-variant-numeric:tabular-nums;padding-top:1px;min-width:42px}
  .b-text{font-size:13.5px;line-height:1.55;color:#333;flex:1}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .ic{font-size:46px;opacity:.5}
  @media(max-width:900px){.sidebar{position:static;width:auto;flex-direction:row;flex-wrap:wrap}.main{margin-left:0}.nav-item{flex:1 1 auto}.rec-layout{grid-template-columns:1fr}}
  @media print{.sidebar{display:none}.main{margin-left:0}.section{display:block!important;page-break-inside:avoid}}

  /* ===== 电邀部门明细看板（LTC） ===== */
  .ltc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(40,33,92,.05);margin-top:24px}
  .ltc-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .ltc-head .ttl{font-size:15px;font-weight:800;color:var(--p-deep);display:flex;align-items:center;gap:8px}
  .ltc-head .ttl::before{content:"";width:5px;height:16px;background:var(--p-light);border-radius:3px}
  .ltc-head .meta{font-size:12px;color:var(--muted)}
  .ltc-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#faf9ff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px}
  .ltc-filters label{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .ltc-filters select{font-size:12.5px;padding:5px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
  .ltc-chips{display:flex;flex-wrap:wrap;gap:5px;max-height:84px;overflow:auto}
  .ltc-chip{padding:3px 9px;border-radius:12px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:#fff;color:var(--ink);transition:.15s;white-space:nowrap}
  .ltc-chip.on{background:var(--p-main);color:#fff;border-color:var(--p-main);font-weight:700}
  .ltc-chip.wk{background:#fff8e6;color:#9a6b00;border-color:#ffe2a0}
  .ltc-chip.wk.on{background:var(--yellow);color:#fff;border-color:var(--yellow)}
  .ltc-chip.wknd{background:#fdeceb;color:#b03a2e;border-color:#f3c6c2}
  .ltc-chip.wknd.on{background:#c0392b;color:#fff;border-color:#c0392b}
  .ltc-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--p-deep);font-size:12px;font-weight:700;cursor:pointer}
  .ltc-btn:hover{background:var(--p-light);color:#fff;border-color:var(--p-light)}
  .ltc-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
  .ltc-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1560px}
  .ltc-table thead th{background:#26215C;color:#fff;padding:8px 9px;font-weight:700;white-space:nowrap;border-right:1px solid rgba(255,255,255,.15);text-align:center;position:sticky;top:0;z-index:3}
  .ltc-table thead th.grp-plan{background:#4338CA}
  .ltc-table thead th.grp-call{background:#0E7490}
  .ltc-table thead th.grp-visit{background:#047857}
  .ltc-table thead th.grp-hist{background:#6D28D9}
  .ltc-table td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums}
  .ltc-table td.name{text-align:left;font-weight:700;color:var(--p-deep)}
  .ltc-table tbody tr:hover td{background:#f6f4ff}
  .ltc-table tr.avg-row td{background:#eef2ff;font-weight:800;color:#3730a3;border-top:2px solid #818cf8}
  .ltc-rate-low{background:#fdeceb !important;color:#c0392b !important;font-weight:700}
  .ltc-rate-mid{background:#fff8e6 !important;color:#b8860b !important;font-weight:700}
  .ltc-rate-hi{background:#e6f6ec !important;color:#2e9e5b !important;font-weight:700}
  .ltc-zero{background:#f3f3f8;color:#b9b9ce}
  .ltc-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);align-items:center;margin-left:auto}
  .ltc-legend span{display:inline-flex;align-items:center;gap:4px}
  .ltc-legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
  .ltc-rec-line{font-size:12.5px;color:var(--muted);margin:10px 2px 4px}
  .ltc-rec-line b{color:var(--p-main)}


  /* ===== 电邀 AI 总结 ===== */
  .ltc-ai{padding:16px 18px;border-radius:12px;background:linear-gradient(135deg,#f6f4ff,#fff);border:1px solid var(--p-light);box-shadow:0 2px 10px rgba(40,33,92,.06);margin-top:14px;font-size:13px;line-height:1.75;color:#3c3c58}
  .ltc-ai h4{margin:0 0 8px;font-size:14px;color:var(--p-deep);display:flex;align-items:center;gap:6px}
  .ltc-ai .ai-body{white-space:pre-wrap;max-height:460px;overflow:auto}
  .ltc-ai .ai-done{font-size:11px;color:var(--muted);margin-top:6px;text-align:right}

</style>
<div id="hz-demo-bar" style="position:fixed;left:0;right:0;top:0;z-index:99999;background:linear-gradient(90deg,#1e293b,#334155);color:#e2e8f0;font-size:12.5px;padding:7px 14px;text-align:center;letter-spacing:.3px">⚠ 演示环境 · 人名与数值均已虚构，通话音频地址与转写正文已移除</div></head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="t">通话质检</div>
    <div class="s" id="brandSub"></div>
  </div>
  <div class="nav-item active" data-sec="overview"><span class="em">📊</span>关键指标概览</div>
  <div class="nav-item" data-sec="record"><span class="em">🎙️</span>录音质检</div>
  <div class="nav-item" data-sec="compare"><span class="em">📈</span>电邀规划师五维对比</div>
  <div class="foot" id="footInfo"></div>
</aside>

<div class="main">
  <header class="topbar">
    <div>
      <h1 id="repTitle"> · 销售通话质检分析报告</h1>
      <div class="sub" id="repSub"></div>
    </div>
    <div class="badges" id="repBadges"></div>
  </header>

  <!-- 关键指标概览 -->
  <section class="section active" id="overview">
    <div class="sec-title">关键指标概览</div>
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- 电邀部门明细看板 -->
    <div class="ltc-card" id="ltcCard">
      <div class="ltc-head">
        <div>
          <div class="ttl">📞 电邀部门明细看板 <span style="font-weight:400;font-size:12px;color:var(--muted)">电邀漏斗分析 + LTC 流程指标</span></div>
          <div class="meta">数据来源：业务管理LTC报表 · <span id="ltcMeta">--</span></div>
        </div>
        <div class="ltc-legend">
          <span><i class="dot ltc-rate-hi"></i>达标</span>
          <span><i class="dot ltc-rate-mid"></i>待提升(&lt;100%)</span>
          <span><i class="dot ltc-rate-low"></i>严重(&lt;80%)</span>
        </div>
      </div>
      <div class="ltc-filters">
        <label>📋 日期筛选（工作日黄底 / 休息日红底 · 单选或多选）:</label>
        <select id="ltcFilter">
          <option value="all">全部天数</option>
          <option value="workday">仅工作日</option>
          <option value="weekend">仅休息日</option>
        </select>
        <div class="ltc-chips" id="ltcChips"></div>
        <button class="ltc-btn" id="ltcAll">全部天</button>

/* ---------- 五维质检结论（按电邀规划师） ---------- */
(function(){
  const ags = DATA.agentSummary || [];
  const grid = document.getElementById("agentGrid");
  const note = document.getElementById("qaNote");
  if(!grid) return;
  if(!ags.length){ grid.innerHTML=`<div class="empty">暂无转写样本，无法生成电邀规划师质检结论</div>`; return; }
  const totalScored = ags.reduce((a,b)=>a+b.count,0);
  note.textContent = `基于 ${totalScored} 段 ≥10秒 通话转写样本`;
  grid.innerHTML = ags.map(a=>{
    const bars = a.avg_dims.map(dm=>{
      const col=dimColor(dm.score);
      return `<div class="score-row"><div class="score-top"><span class="score-name">${dm.name}</span><span class="score-val" style="color:${col}">${dm.score} / 5</span></div><div class="score-track"><div class="score-fill" style="width:${dm.score/5*100}%;background:${col}"></div></div></div>`;
    }).join("");
    const str = a.strengths.length ? a.strengths.map(t=>`<span class="tag tag-ok">✓ ${t}</span>`).join("") : `<span class="tag">—</span>`;
    const weak = a.weaknesses.length ? a.weaknesses.map(t=>`<span class="tag tag-bad">⚠ ${t}</span>`).join("") : `<span class="tag">—</span>`;
    const vet = (a.vetoes&&a.vetoes.length)
      ? a.vetoes.map(v=>`<div class="veto-item"><span class="vt-cnt">${v.count}次</span><span>${v.text}</span></div>`).join("")
      : `<div class="ac-sug" style="background:#e6f6ec;border-color:#bfe6cd;color:#2e9e5b">✓ 本批样本未触发否决项</div>`;
    const sug = a.suggestions.map(t=>`<div class="ac-sug" style="margin-bottom:8px">${t}</div>`).join("");
    return `<div class="agent-card">
      <div class="ac-head"><div><div class="ac-name">${a.person}</div><div class="ac-cnt">已质检 ${a.count} 段通话</div></div><div class="ac-ov">综合 ${a.overall} / 5</div></div>
      ${bars}
      <div class="ac-block"><div class="ac-label"><span class="dot"></span>优势亮点</div><div class="ac-tags">${str}</div></div>
      <div class="ac-block"><div class="ac-label"><span class="dot"></span>待改进维度</div><div class="ac-tags">${weak}</div></div>
      <div class="ac-block"><div class="ac-label"><span class="dot"></span>否决项</div>${vet}</div>
      <div class="ac-block"><div class="ac-label"><span class="dot"></span>改进建议</div>${sug}</div>
    </div>`;
  }).join("");
})();

/* ---------- 电邀规划师五维对比（支持 事业部 / 时间段 筛选，客户端实时聚合） ---------- */
(function(){
  const elBar=document.getElementById("cmpBar");
  const elRadar=document.getElementById("cmpRadar");
  const elLegend=document.getElementById("cmpLegend");
  const elTable=document.getElementById("cmpTable");
  const elSum=document.getElementById("cmpSummary");
  const elTrend=document.getElementById("cmpTrend");
  const elDept=document.getElementById("cmpDept");
  const elTime=document.getElementById("cmpTime");
  const elNote=document.getElementById("cmpFilterNote");
  if(!elBar){ return; }

  const DIMS=["开场介绍","痛点价值","需求挖掘","异议处理","加微埋点"];
  const palette=["#534AB7","#E8833A","#2BA8A1"];
  const round=(v,d=1)=>Math.round(v*Math.pow(10,d))/Math.pow(10,d);
  const avg=a=> a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;

  // 稳定配色：以全部已转写电邀规划师为基准，避免筛选切换时颜色跳变
  const ALL_PERSONS=[...new Set((DATA.recordings||[]).filter(r=>r.transcribed).map(r=>r.person))];
  const PERSON_COLOR={}; ALL_PERSONS.forEach((p,i)=>PERSON_COLOR[p]=palette[i%palette.length]);

  // 事业部下拉（数据驱动）
  const depts=[...new Set((DATA.recordings||[]).filter(r=>r.transcribed).map(r=>r.dept).filter(Boolean))];
  if(elDept){ elDept.innerHTML=`<option value="all">全部事业部</option>`+depts.map(d=>`<option value="${d}">${d}</option>`).join(""); }

  // 客户端聚合：从已转写录音按当前筛选条件实时计算五维均分
  function aggregate(recs){
    const byPerson={};
    recs.filter(r=>r.transcribed && r.dims && r.dims.length).forEach(r=>{ (byPerson[r.person]=byPerson[r.person]||[]).push(r); });
    const agents=[];
    Object.keys(byPerson).forEach(p=>{
      const rs=byPerson[p];
      const acc={}; DIMS.forEach(d=>acc[d]=[]);
      rs.forEach(r=>(r.dims||[]).forEach(dm=>{ if(dm.name in acc) acc[dm.name].push(dm.score); }));
      const avg_dims=DIMS.map(d=>({name:d, score: round(avg(acc[d]))}));
      const overall=round(avg(rs.map(r=>r.overall)));
      const scoreByName={}; avg_dims.forEach(d=>scoreByName[d.name]=d.score);
      agents.push({person:p, count:rs.length, overall, dims:avg_dims, scoreByName, color:PERSON_COLOR[p]||"#888"});
    });
    agents.sort((a,b)=>b.overall-a.overall);
    return agents;
  }
  function hourOf(time){
    const tm=String(time||"").split(" ")[1]||"";
    const m=tm.match(/^(\d{1,2}):/); return m? +m[1] : null;
  }
  function passFilter(r, dept, time){
    if(dept!=="all" && (r.dept||"")!==dept) return false;
    if(time!=="all"){
      const h=hourOf(r.time); if(h===null) return false;
      if(time==="am" && !(h>=9 && h<12)) return false;
      if(time==="pm" && !(h>=12 && h<18)) return false;
    }
    return true;
  }
  function renderAll(){
    const dept=elDept?elDept.value:"all";
    const time=elTime?elTime.value:"all";
    const recs=(DATA.recordings||[]).filter(r=>r.transcribed && passFilter(r,dept,time));
    const agents=aggregate(recs);
    const colors={}; agents.forEach(a=>colors[a.person]=a.color);
    if(!agents.length){
      const empty=`<div class="empty">当前筛选条件下无已转写样本</div>`;
      elLegend.innerHTML=""; elBar.innerHTML=elRadar.innerHTML=elTrend.innerHTML=elTable.innerHTML=elSum.innerHTML=empty;
      if(elNote) elNote.innerHTML=`<b style="color:#c0392b">无样本</b>`;
      return;
    }
    elLegend.innerHTML=agents.map(a=>`<div class="cmp-leg"><span class="sw" style="background:${a.color}"></span>${a.person}<span class="ov">${a.overall}/5</span></div>`).join("");
    elBar.innerHTML = renderGroupedBar(agents, DIMS);
    elRadar.innerHTML = renderRadarCompare(agents, DIMS);
    const recsByAgent={};
    recs.forEach(r=>{ (recsByAgent[r.person]=recsByAgent[r.person]||[]).push(r); });
    Object.values(recsByAgent).forEach(arr=> arr.sort((a,b)=> String(a.time).localeCompare(String(b.time))));
    elTrend.innerHTML = renderTrend(recsByAgent, colors);
    const thead=`<tr><th>维度</th>${agents.map(a=>`<th style="color:${a.color}">${a.person}<br><span style="font-weight:600;color:#9a9ab0">综合 ${a.overall}</span></th>`).join("")}</tr>`;
    const tbody = DIMS.map(dim=>{
      const cells = agents.map(a=>{
        const sc=a.scoreByName[dim]??0; const c=dimColor(sc);
        return `<td><span class="cell" style="color:${c};background:${c}18">${sc}</span></td>`;
      }).join("");
      return `<tr><td>${dim}</td>${cells}</tr>`;
    }).join("");
    elTable.innerHTML=thead+tbody;
    elSum.innerHTML = agents.map(a=>{
      const best = DIMS.reduce((b,d)=> (a.scoreByName[d]>(a.scoreByName[b]||0))?d:b, DIMS[0]);
      const worst = DIMS.reduce((b,d)=> (a.scoreByName[d]<(a.scoreByName[b]??99))?d:b, DIMS[0]);
      return `<div class="cmp-scard"><h4><span class="dot" style="background:${a.color}"></span>${a.person} · 综合 ${a.overall}/5</h4>
        <p>已质检样本 <b>${a.count}</b> 段。<br>最强维度：<b style="color:${dimColor(a.scoreByName[best])}">${best}（${a.scoreByName[best]}）</b><br>最弱维度：<b style="color:${dimColor(a.scoreByName[worst])}">${worst}（${a.scoreByName[worst]}）</b></p></div>`;
    }).join("");
    if(elNote) elNote.innerHTML=`当前样本 <b>${recs.length}</b> 段${dept!=="all"?` · ${dept}`:""}${time!=="all"?` · ${time==="am"?"上午 09–12 时":"下午 12–18 时"}`:""}`;
  }

  if(elDept) elDept.addEventListener("change", renderAll);
  if(elTime) elTime.addEventListener("change", renderAll);
  renderAll();

  function renderGroupedBar(agents, dims){
    const W=720,H=300,padL=34,padR=14,padT=16,padB=54;
    const plotW=W-padL-padR, plotH=H-padT-padB, maxV=5, nD=dims.length;
    const groupW=plotW/nD, barW=Math.min(30, groupW*0.20), gap=groupW*0.10;
    const y=v=> padT+plotH*(1-v/maxV);
    let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:760px">`;
    [0,1,2,3,4,5].forEach(v=>{ const yy=y(v); svg+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eee" stroke-width="1"/><text x="${padL-6}" y="${yy+4}" font-size="11" fill="#9a9ab0" text-anchor="end">${v}</text>`; });
    dims.forEach((dim,di)=>{
      const gx=padL+groupW*di+groupW/2;
      const totalW=barW*agents.length+gap*(agents.length-1);
      const startX=gx-totalW/2;
      agents.forEach((a,ai)=>{
        const sc=a.scoreByName[dim]??0;
        const bx=startX+ai*(barW+gap); const by=y(sc); const bh=padT+plotH-by;
        svg+=`<rect x="${bx}" y="${by}" width="${barW}" height="${bh}" rx="3" fill="${a.color}"/>`;
        svg+=`<text x="${bx+barW/2}" y="${by-4}" font-size="10" fill="${a.color}" text-anchor="middle" font-weight="700">${sc}</text>`;
      });
      svg+=`<text x="${gx}" y="${H-padB+20}" font-size="12" fill="#555" text-anchor="middle">${dim}</text>`;
    });
    svg+=`</svg>`;
    return svg;
  }
  function renderRadarCompare(agents, dims){
    const cx=140,cy=128,R=88,N=dims.length;
    const ang=i=> -Math.PI/2 + i*2*Math.PI/N;
    const pt=(i,rad)=>[cx+rad*Math.cos(ang(i)), cy+rad*Math.sin(ang(i))];
    let svg=`<svg viewBox="0 0 280 250" width="100%" style="max-width:300px">`;
    [1,2,3,4,5].forEach(g=>{ const rad=R*g/5; const p=Array.from({length:N},(_,i)=>pt(i,rad).join(",")).join(" "); svg+=`<polygon points="${p}" fill="none" stroke="#e6e6f2"/>`; });
    let axes="",labels="";
    dims.forEach((d,i)=>{ const[x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6e6f2"/>`; const[lx,ly]=pt(i,R+24); labels+=`<text x="${lx}" y="${ly}" font-size="11" fill="#6b6b86" text-anchor="middle">${d}</text>`; });
    svg+=axes;
    agents.forEach(a=>{ const vpts=a.dims.map((dm,i)=>pt(i,R*(dm.score/5)).join(",")).join(" "); svg+=`<polygon points="${vpts}" fill="${a.color}22" stroke="${a.color}" stroke-width="2"/>`; });
    svg+=labels; svg+=`</svg>`;
    return svg;
  }
  function renderTrend(recsByAgent, colors){
    const W=720,H=240,padL=34,padR=14,padT=16,padB=40;
    const plotW=W-padL-padR, plotH=H-padT-padB, maxV=5;
    const y=v=>padT+plotH*(1-v/maxV);
    let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:760px">`;
    [0,1,2,3,4,5].forEach(v=>{const yy=y(v); svg+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eee"/><text x="${padL-6}" y="${yy+4}" font-size="11" fill="#9a9ab0" text-anchor="end">${v}</text>`;});
    svg+=`<text x="${padL}" y="${H-10}" font-size="11" fill="#9a9ab0">通话先后（早 → 晚）</text>`;
    Object.entries(recsByAgent).forEach(([person,arr])=>{
      const col=colors[person]; const n=arr.length;
      const pts=arr.map((r,i)=>{ const x= padL + (n>1? i/(n-1):0.5)*plotW; const yy=y(r.overall); return [x,yy]; });
      const dpath=pts.map((p,i)=> (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
      svg+=`<path d="${dpath}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
      pts.forEach(p=> svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${col}"/>`);
    });
    svg+=`</svg>`;
    return svg;
  }
})();

/* ---------- 录音库（真实数据） ---------- */
const recs = DATA.recordings || [];
const recStat = DATA.recStat || {};
let audioEl = null;
let curFilter = {caller:"all", source:"all", dur:"all", q:""};

/* 统计条 */

function filtered(){
  const q=curFilter.q.toLowerCase();
  return recs.filter(r=>{
    if(curFilter.caller!=="all" && r.person!==curFilter.caller) return false;
    if(curFilter.source!=="all" && r.source!==curFilter.source) return false;
    if(curFilter.dur!=="all" && (r.durationSec||0) < Number(curFilter.dur)) return false;
    if(q && !(String(r.customer||"").toLowerCase().includes(q) || String(r.person||"").toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderList(){
  const list=document.getElementById("recList");
  const data=filtered();
  document.getElementById("recCnt").textContent=`当前 ${data.length} / ${recs.length} 段`;
  if(!data.length){ list.innerHTML=`<div class="empty"><div class="ic">🔍</div><p style="margin-top:12px">无匹配录音</p></div>`; return; }
  list.innerHTML=data.map(r=>`
    <div class="rec-item" data-id="${r.id}">

function fmtSec(s){ if(s==null) return "--:--"; s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); const ss=String(s%60).padStart(2,'0'); return m+":"+ss; }
function dimColor(sc){ if(sc>=4) return "#2e9e5b"; if(sc>=2.5) return "#e8a33d"; return "#d9534f"; }
function renderRadar(ds){
  const cx=110, cy=110, R=82, N=ds.length;
  const ang=i=> -Math.PI/2 + i*2*Math.PI/N;
  const pt=(i,rad)=>[cx+rad*Math.cos(ang(i)), cy+rad*Math.sin(ang(i))];
  let grid="";
  [1,2,3,4,5].forEach(g=>{ const rad=R*g/5; const p=Array.from({length:N},(_,i)=>pt(i,rad).join(",")).join(" "); grid+=`<polygon points="${p}" fill="none" stroke="#e6e6f2" stroke-width="1"/>`; });
  let axes="",labels="";
  ds.forEach((d,i)=>{ const[x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6e6f2"/>`; const[lx,ly]=pt(i,R+20); labels+=`<text x="${lx}" y="${ly}" font-size="11" fill="#6b6b86" text-anchor="middle">${d.name}</text>`; });
  const vpts=ds.map((d,i)=>pt(i,R*(d.score/5)).join(",")).join(" ");
  let dots=""; ds.forEach((d,i)=>{ const[x,y]=pt(i,R*(d.score/5)); dots+=`<circle cx="${x}" cy="${y}" r="3.5" fill="#534AB7"/>`; });
  return `<svg viewBox="0 0 220 226" width="220" height="226">${grid}${axes}<polygon points="${vpts}" fill="rgba(83,74,183,.26)" stroke="#534AB7" stroke-width="2"/>${dots}${labels}</svg>`;
}
function renderDetail(r){
  const d=document.getElementById("recDetail");
  if(!r){ d.innerHTML=`<div class="empty"><div class="ic">🎙️</div><p style="margin-top:12px">请选择左侧录音查看详情</p></div>`; return; }
  const DIMS=["开场介绍","痛点价值","需求挖掘","异议处理","加微埋点"];
  const dims = r.transcribed ? r.dims : DIMS.map(n=>({name:n,score:0}));
  const scoreHTML = dims.map(dm=>{
    const sc = r.transcribed ? dm.score : 0;
    const col = dimColor(sc);
    return `<div class="score-row">
      <div class="score-top"><span class="score-name">${dm.name}</span><span class="score-val" style="color:${col}">${r.transcribed? sc+" / 5":"待转写"}</span></div>
      <div class="score-track"><div class="score-fill" style="width:${r.transcribed? sc/5*100:0}%;background:${col}"></div></div>
    </div>`;
  }).join("");
  const ov = r.transcribed ? r.overall : "待质检";
  const radarHTML = r.transcribed ? `<div class="radar-wrap">${renderRadar(r.dims)}</div>` : `<div class="empty" style="padding:24px"><p>转写完成后生成能力雷达图</p></div>`;
  const sugHTML = (r.suggestions||[]).map(t=>`<div class="sug-item">• ${t}</div>`).join("") || `<div class="empty"><p>暂无建议</p></div>`;
  const strHTML = (r.strengths||[]).map(t=>`<span class="tag tag-ok">✓ ${t}</span>`).join("") || `<span class="tag">—</span>`;
  const weakHTML = (r.weaknesses||[]).map(t=>`<span class="tag tag-bad">⚠ ${t}</span>`).join("") || `<span class="tag">—</span>`;
  const vetoHTML = (r.veto&&r.veto.length) ? r.veto.map(t=>`<div class="veto-item"><span class="vt-cnt">!</span><span>${t}</span></div>`).join("") : `<div class="ac-sug" style="background:#e6f6ec;border-color:#bfe6cd;color:#2e9e5b">✓ 未触发否决项</div>`;
  const bubbles = (r.segments&&r.segments.length) ? r.segments.map(s=>`
    <div class="bubble" data-s="${s.start!=null?s.start:''}" data-e="${s.end!=null?s.end:''}">
      <span class="b-time">${s.start!=null?fmtSec(s.start):'--:--'}</span>
      <span class="b-text">${s.text}</span>
    </div>`).join("") : `<div class="empty" style="padding:30px"><div class="ic">💬</div><p style="margin-top:10px">${r.transcribed?"该通话转写为空":"云 ASR 转写完成后，在此展示逐句对话（点击气泡跳播）"}</p></div>`;
  d.innerHTML=`
    <div class="rd-head">
      <div>
        <div class="rd-title">${r.customer}</div>
        <div class="rd-meta">${r.person}　·　${r.dept||""}　·　${r.source||""}　·　${r.time||""}　·　${fmtSec(r.durationSec)}</div>
      </div>
      <div class="rd-overall"><div class="ov">${ov}</div><div class="ovl">综合评分 / 5</div></div>
    </div>
    <div class="player-bar">
      <audio id="recAudio" controls preload="none" src="" style="display:none"></audio>
      ${''?`<a class="audio-link" href="${''}" target="_blank" rel="noopener">在新窗口打开录音 ↗</a>`:''}
    </div>
    <div class="card">
      <div class="sec-title" style="margin-top:0">五维质检评分</div>
      <div class="qa-grid">
        <div>${scoreHTML}</div>
        <div class="radar-box">${radarHTML}</div>
      </div>
      <div class="demo-note" style="margin-top:10px">${r.transcribed?"✅ 已完成腾讯云 ASR 转写与五维质检":"⏳ 待云 ASR 转写完成后自动生成五维评分与逐句分析"}</div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="sec-title" style="margin-top:0">质检结论</div>
      <div class="qa-sub">优势亮点</div><div class="tags">${strHTML}</div>
      <div class="qa-sub">待改进维度</div><div class="tags">${weakHTML}</div>
      <div class="qa-sub">否决项</div>${vetoHTML}
      <div class="qa-sub">改进建议</div><div class="sug-box">${sugHTML}</div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="sec-title" style="margin-top:0">逐句转写 <span style="font-weight:400;color:#9a9ab0;font-size:12px">（点击气泡跳播，播放时高亮跟随）</span></div>
      <div class="bubbles">${bubbles}</div>
    </div>`;
  audioEl=document.getElementById("recAudio");
  // 点击气泡跳播
  d.querySelectorAll('.bubble').forEach(b=>{
    const s=parseFloat(b.dataset.s);
    if(!isNaN(s)) b.addEventListener('click',()=>{ if(audioEl){ audioEl.currentTime=s; audioEl.play(); } });
  });
  // 播放进度高亮
  if(audioEl){
    audioEl.addEventListener('timeupdate',()=>{
      const t=audioEl.currentTime;
      d.querySelectorAll('.bubble').forEach(b=>{
        const s=parseFloat(b.dataset.s), e=parseFloat(b.dataset.e);
        if(!isNaN(s)&&!isNaN(e)&&t>=s&&t<=e) b.classList.add('playing'); else b.classList.remove('playing');
      });
    });
  }
}

document.getElementById("fCaller").addEventListener("change",e=>{curFilter.caller=e.target.value; renderList();});
document.getElementById("fSource").addEventListener("change",e=>{curFilter.source=e.target.value; renderList();});
document.getElementById("fDur").addEventListener("change",e=>{curFilter.dur=e.target.value; renderList();});
document.getElementById("fQ").addEventListener("input",e=>{curFilter.q=(e.target.value||"").trim(); renderList();});

if(recs.length){

  const first=filtered()[0];
  if(first){ document.querySelector(`.rec-item[data-id="${first.id}"]`)?.classList.add("active"); renderDetail(first); }
}else{

  document.getElementById("recDetail").innerHTML=`<div class="empty"><div class="ic">🎙️</div><p style="margin-top:12px">待接入通话录音</p></div>`;

<!-- LTC 电邀明细渲染 -->
<script>
(function(){
  var L = (typeof DATA !== "undefined" && DATA.ltcDaily) || null;
  if (!L) return;
  var host = document.getElementById("ltcCard");
  if (!host) return;

  var days = (L.days || []).slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var recSet = L.staff_with_recordings || [];
  var pick = new Set();
  var mode = "all";

  var COLS = [
    {k:"name",       lab:"姓名",       w:64,  type:"name"},
    {k:"dept",       lab:"部门",       w:130, type:"text"},
    {k:"tenure",     lab:"司龄(月)",   w:54,  type:"num"},
    {k:"plan_dial",  lab:"计划拨打量", w:60,  type:"num", grp:"plan"},
    {k:"plan_exec",  lab:"计划执行量", w:60,  type:"num", grp:"plan"},
    {k:"plan_exec_rate", lab:"计划执行率", w:60, type:"rate", grp:"plan"},
    {k:"plan_touch", lab:"计划接触量", w:60,  type:"num", grp:"plan"},
    {k:"plan_touch_rate", lab:"计划接触率", w:60, type:"rate", grp:"plan"},
    {k:"plan_transfer", lab:"计划转私客量", w:60, type:"num", grp:"plan"},
    {k:"all_dial",   lab:"拨打量",     w:58,  type:"num", grp:"call"},
    {k:"all_conn",   lab:"接通量",     w:58,  type:"num", grp:"call"},
    {k:"all_conn_rate", lab:"接通率",  w:58,  type:"rate", grp:"call"},
    {k:"all_duration", lab:"通时(分)", w:60,  type:"num", grp:"call"},
    {k:"dial_30s",   lab:"30秒电话数", w:62,  type:"num", grp:"call"},
    {k:"wechat_bind", lab:"微信绑定量", w:62, type:"num", grp:"call"},
    {k:"visit_total", lab:"当日见客量", w:60, type:"num", grp:"visit"},
    {k:"star_total", lab:"单日意向客", w:60, type:"num", grp:"visit"},
    {k:"visit_30d",  lab:"近30天见客量", w:62, type:"num", grp:"hist"},
    {k:"sign_30d",   lab:"近30天签单量", w:62, type:"num", grp:"hist"}
  ];
  var RATE_KEYS = {plan_exec_rate:1, plan_touch_rate:1, all_conn_rate:1};

  function num(v){ return (v===null||v===undefined||isNaN(v)) ? 0 : Number(v); }
  function fmtNum(v){ return num(v).toLocaleString("zh-CN",{maximumFractionDigits:1}); }

  function rateCell(v){
    if (v===null || v===undefined || isNaN(v) || v===0) return '<td class="ltc-zero">--</td>';
    var cls = v < 0.8 ? "ltc-rate-low" : (v < 1.0 ? "ltc-rate-mid" : "ltc-rate-hi");
    return '<td class="'+cls+'">'+(v*100).toFixed(1)+'%</td>';
  }
  function numCell(v){
    if (v===0 || v===null || v===undefined) return '<td class="ltc-zero">0</td>';
    return '<td>'+fmtNum(v)+'</td>';
  }
  function cellFor(c, v){
    if (c.type==="rate") return rateCell(v);
    return numCell(v);
  }
  function avgCell(c, vals){
    if (c.type==="rate"){
      var vs = vals.filter(function(x){ return x!==null && !isNaN(x) && x>0; });
      if (!vs.length) return '<td>--</td>';
      var avg = vs.reduce(function(a,b){return a+b;},0)/vs.length;
      return rateCell(avg);
    }
    var sum = vals.reduce(function(a,b){ return a + num(b); },0);
    return numCell(sum);
  }

  function selectedDays(){
    if (mode==="all" && pick.size===0) return days.length ? [days[days.length-1]] : [];
    if (mode!=="all" && pick.size===0){
      return days.filter(function(d){ return mode==="workday" ? !d.is_weekend : d.is_weekend; });
    }
    return days.filter(function(d){ return pick.has(d.date); });
  }

  function buildChips(){
    var h = document.getElementById("ltcChips");
    if (!h) return;
    h.innerHTML = "";
    days.forEach(function(d){
      var el = document.createElement("span");
      el.className = "ltc-chip " + (d.is_weekend ? "wknd" : "wk") + (pick.has(d.date) ? " on" : "");
      el.textContent = d.date_cn + " " + d.weekday;
      el.title = d.date;
      el.onclick = function(){
        if (pick.has(d.date)) pick.delete(d.date); else pick.add(d.date);
        render();
      };
      h.appendChild(el);
    });
  }

  function render(){
    var picked = selectedDays();
    // 汇总选中天
    var byName = {};
    picked.forEach(function(d){
      (d.staff||[]).forEach(function(st){
        if (recSet.indexOf(st.name) < 0) return; // 仅显示有录音人员
        if (!byName[st.name]) byName[st.name] = {name:st.name, dept:st.dept, tenure:st.tenure, rows:[]};
        byName[st.name].rows.push(st);
      });
    });
    var names = Object.keys(byName).sort(function(a,b){
      var pa=byName[a], pb=byName[b];
      var ta=pa.rows.reduce(function(s,r){return s+num(r.plan_dial);},0);
      var tb=pb.rows.reduce(function(s,r){return s+num(r.plan_dial);},0);
      return tb-ta;
    });

    // 表头
    var html = '<thead><tr><th rowspan="2" style="min-width:64px">姓名</th><th rowspan="2" style="min-width:130px">部门</th><th rowspan="2">司龄(月)</th>';
    // 计划组
    var groups = [
      {name:"计划执行", cls:"grp-plan", cols:["plan_dial","plan_exec","plan_exec_rate","plan_touch","plan_touch_rate","plan_transfer"]},
      {name:"通话执行", cls:"grp-call", cols:["all_dial","all_conn","all_conn_rate","all_duration","dial_30s","wechat_bind"]},
      {name:"见客转化", cls:"grp-visit", cols:["visit_total","star_total"]},
      {name:"近30天", cls:"grp-hist", cols:["visit_30d","sign_30d"]}
    ];
    html += '<th rowspan="2" style="min-width:20px"></th>';
    groups.forEach(function(g){
      html += '<th colspan="'+g.cols.length+'" class="'+g.cls+'" style="border-bottom:1px solid rgba(255,255,255,.15)">'+g.name+'</th>';
    });
    html += '</tr><tr>';
    groups.forEach(function(g){
      g.cols.forEach(function(k){
        var c = COLS.filter(function(x){return x.k===k;})[0];
        html += '<th class="'+g.cls+'">'+c.lab+'</th>';
      });
    });
    html += '</tr></thead><tbody>';

    // 每人（多天聚合：计数列求和，率列按加权/平均）
    names.forEach(function(nm){
      var p = byName[nm];
      var agg = {};
      COLS.forEach(function(c){
        if (c.type==="rate"){
          var vp = p.rows.filter(function(r){ return r[c.k]!==null && !isNaN(r[c.k]) && r[c.k]>0; });

    });
  }
  var aiBtn = document.getElementById("ltcAiBtn");

  function b64(buf) {

  }
  function hmacSha256Base64(secret, message) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"])
      .then(function (key) { return crypto.subtle.sign("HMAC", key, enc.encode(message)); })

      '<span><button id="qaClear" title="清空对话上下文">清空</button><button id="qaClose">×</button></span></div>' +
      '<div id="qaBody"></div>' +
      '<div id="qaChips">' + chips.map(function (c) { return '<span class="qa-chip">' + c + "</span>"; }).join("") + "</div>" +
      '<div id="qaInputBar"><input id="qaInput" placeholder="问任意数据问题，如「公司整体情况？」" /><button id="qaSend">发送</button></div>';
    document.body.appendChild(fab);
    document.body.appendChild(box);
    var body = box.querySelector("#qaBody");
    body.appendChild(msg("bot", "你好，我是数据助手「小析」🤖\n我已掌握工作空间全部看板数据（活动量 / 员工三力 / 人员分析 / 通话质检），可连续对话、记得上下文。用自然语言问我即可，例如「整体达标情况？」「哪位电邀规划师最需要改进？」「公司整体建议？」。"));

    function msg(role, text, extraCls) {
      var d = document.createElement("div");
      d.className = "qa-msg " + (role === "user" ? "qa-user" : "qa-bot") + (extraCls ? " " + extraCls : "");
      d.textContent = text;
      return d;
    }
    var busy = false;
    function send(q) {
      q = (q || "").trim();
      if (!q || busy) return;
      busy = true;
      body.appendChild(msg("user", q));
      pushTurn("user", q);
      // 思考过程：两步可见
      var think = msg("bot", "📚 正在结合全部看板数据…", "qa-thinking qa-cursor");
      body.appendChild(think);
      body.scrollTop = body.scrollHeight;
      buildContext().then(function (ctx) {
        if (!ctx) {
          think.textContent = "⚠️ 当前页面工作空间数据尚未加载，请稍候刷新后再试。";
          think.classList.remove("qa-thinking", "qa-cursor");
          busy = false; return;
        }
        think.textContent = "🧠 小析正在分析…";
        // 流式：首字到达后进入"生成中"光标态
        var started = false;
        askLLM(q, ctx,
          function (token) {
            if (!started) { started = true; think.textContent = ""; think.classList.remove("qa-thinking"); think.classList.add("qa-cursor"); }
            think.textContent += token;
            body.scrollTop = body.scrollHeight;
          },
          function () {
            think.classList.remove("qa-cursor");
            pushTurn("assistant", think.textContent);
            busy = false;
          },
          function (e) {
            think.textContent = "⚠️ AI 服务暂不可用：" + (e && e.message ? e.message : e) +
              "\n\n可稍后重试；若持续失败，可能是代理/接口额度或网络限制。";
            think.classList.remove("qa-thinking", "qa-cursor");
            busy = false;
          });
      }).catch(function () {
        think.textContent = "⚠️ 数据背景加载失败，请刷新页面后重试。";
        think.classList.remove("qa-thinking", "qa-cursor");
        busy = false;
      });
    }
    fab.addEventListener("click", function () { box.classList.toggle("qa-hidden"); });
    box.querySelector("#qaClose").addEventListener("click", function () { box.classList.add("qa-hidden"); });
    box.querySelector("#qaClear").addEventListener("click", function () {
      conversation = [];
      body.innerHTML = "";
      body.appendChild(msg("bot", "🧹 已清空对话上下文，新话题开始。"));
    });
    box.querySelector("#qaSend").addEventListener("click", function () { send(box.querySelector("#qaInput").value); box.querySelector("#qaInput").value = ""; });
    box.querySelector("#qaInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { send(this.value); this.value = ""; } });
    Array.prototype.forEach.call(box.querySelectorAll(".qa-chip"), function (c) {
      c.addEventListener("click", function () { send(c.textContent); });
    });
  }

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", buildUI);
    } else {
      buildUI();
    }
  }
  if (typeof globalThis !== "undefined") {
    globalThis.MiniQA = { askLLM: askLLM, buildContext: buildContext, version: "3.0" };
  }
})();

</script>
<!-- MiniQA:end -->
</body>
</html>
