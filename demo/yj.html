<title>分公司业绩含续费 · </title>
<style>
:root{
  --bg:#f8f5fb;--card:#fff;--border:#e9e2f2;--muted:#7b7590;
  --text:#3a3350;--accent:#8b7bb8;--accent2:#8fb8dd;--accent-soft:#f2ecfb;
  --green:#3f8f74;--red:#c2557a;--amber:#a8823a;--blue:#5d86b8;
  --kpi0:#b9a6e3;--kpi1:#8fd0bb;--kpi2:#f0cf8a;--kpi3:#9fc6e8;--kpi4:#eda6bc;--kpi5:#f2b48f;
  --kpi0s:#f4effc;--kpi1s:#ecf8f4;--kpi2s:#fdf6e6;--kpi3s:#edf5fd;--kpi4s:#fdf0f5;--kpi5s:#fdf3ec;
  --sh:0 4px 16px rgba(140,120,180,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:
  radial-gradient(920px 460px at 6% -8%,#fce7f0 0%,rgba(252,231,240,0) 62%),
  radial-gradient(820px 420px at 98% 0%,#e4f1fb 0%,rgba(228,241,251,0) 60%),
  var(--bg);color:var(--text);
  font:14px/1.65 -apple-system,"Microsoft YaHei","PingFang SC",sans-serif;padding:18px 20px 40px}
.container{max-width:1500px;margin:0 auto}
.board-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.board-nav a{text-decoration:none;font-size:12.5px;font-weight:600;color:#5c5670;background:rgba(255,255,255,.86);
  border:1px solid var(--border);border-radius:10px;padding:6px 13px;transition:.15s}
.board-nav a:hover{border-color:#c9b8e6;color:var(--accent);background:#faf6ff}
.board-nav a.act{background:linear-gradient(135deg,#cbb9ea,#a8cbea);border-color:#c3b2e4;color:#3d3560}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;margin-bottom:8px;
  background:linear-gradient(115deg,#f7eaf9 0%,#eef1fc 50%,#e9f6f2 100%);
  border:1px solid var(--border);border-radius:16px;padding:13px 20px;box-shadow:var(--sh)}
.hd h1{font-size:22px;letter-spacing:.5px;color:#413a5c}
.hd .sub{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:12px 0}
.lbl{color:var(--muted);font-size:12px;white-space:nowrap}
select,input{font:13px/1.4 inherit;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);outline:none}
select:focus,input:focus{border-color:#c3b2e4;box-shadow:0 0 0 3px rgba(185,166,227,.22)}
.btn{border:0;border-radius:10px;background:linear-gradient(135deg,#b9a6e3,#9fc0e6);color:#3a3350;font:700 13px/1 inherit;padding:10px 20px;cursor:pointer;box-shadow:0 3px 10px rgba(160,140,200,.22)}
.btn.ghost{background:#fff;color:#6f5f9c;border:1px solid #d8cdee;box-shadow:none}
.btn:hover{filter:brightness(1.04);box-shadow:0 5px 14px rgba(160,140,200,.28)}
.btn.ghost:hover{background:#faf6ff;border-color:#c3b2e4}
.note{background:#f3f8ec;border:1px solid #e0ebcf;border-radius:12px;padding:8px 14px;font-size:12px;color:#5f7442;margin:8px 0 14px}
.warn{background:#fdeef3;border:1px solid #f4cede;border-radius:12px;padding:8px 14px;font-size:12px;color:#a8466b;margin:8px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.kpi{background:linear-gradient(180deg,var(--kcs,#fff) 0%,#fff 64%);border:1px solid var(--border);border-left:4px solid var(--kc,var(--kpi0));border-radius:14px;padding:12px 16px;box-shadow:var(--sh)}
.kpi .t{color:var(--muted);font-size:12px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:.3px;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:16px 0;box-shadow:var(--sh)}
.panel h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:#413a5c}
.panel h3 .tag{font-size:11px;font-weight:700;color:#6f5f9c;background:var(--accent-soft);border-radius:8px;padding:2px 9px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--border);padding:7px 11px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
thead th{background:#e3d8f6;color:#3f3560;font-weight:700;border-color:#d9ccf0}
thead th.grp{background:#dccff2;color:#3f3560}
thead th.grp.on{background:linear-gradient(135deg,#cbb9ea,#b7d3ee);color:#38304f}
thead tr.sub th{background:#f4eefc;color:#4b4168;font-weight:600;font-size:12px;border-color:#e5dbf5}
tbody th{background:#fbf8ff;font-weight:600;text-align:left;color:#413a5c}
tbody tr:nth-child(even) td{background:#fdfbff}
tbody tr.total th,tbody tr.total td{background:#f2eafc;font-weight:700;border-top:2px solid #b9a6e3}
tbody tr:hover td,tbody tr:hover th{background:#f7f1fd}
td.neg{color:var(--red);font-weight:700}
td.pos{color:var(--green);font-weight:700}
/* 完成率徽章：马卡龙浅底 + 深字（对比度更高） */
.rb{display:inline-block;min-width:64px;border-radius:8px;padding:2px 9px;font-weight:700;font-size:12.5px;letter-spacing:.2px}
.rb.bad{background:#fbdbe6;color:#a83f63;border:1px solid #f4c4d6}
.rb.mid{background:#fbeac6;color:#8b6a1e;border:1px solid #f2dcae}
.rb.good{background:#d5f0e4;color:#2b7a5e;border:1px solid #b9e5d3}
.rb.na{background:#eeecf4;color:#8b8699;border:1px solid #e0dceb}
.hidden{display:none}
/* PK */
.pkbar{display:flex;align-items:center;gap:10px;margin:6px 0}
.pkbar .nm{width:110px;font-weight:600;font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#5c5670}
.pkbar .tr{flex:1;height:22px;background:#f4eefb;border-radius:8px;overflow:hidden}
.pkbar .fl{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;color:#3a3350;font-size:11px;font-weight:800;min-width:2px;transition:width .4s}
.pkA .fl{background:linear-gradient(90deg,#c6dff5,#9fc6e8)} .pkB .fl{background:linear-gradient(90deg,#fbd9c2,#f2b48f)}
.pkhead{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:8px 10px;align-items:center;margin:10px 0 2px;font-weight:700}
.pkhead .cA{color:#3f6f9e} .pkhead .cB{color:#a8632f}
.foot{margin-top:18px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:900px){.kpi .v{font-size:19px}.pkhead{grid-template-columns:90px 1fr 90px 1fr}}
</style>

<script>
var RAW=null,CUR_KEY=null,CO='云国欣',WEEK_PCT=60,DAY_PCT=10;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n,d){if(n==null||isNaN(n))return '--';var neg=n<0;var s=Math.abs(+n).toLocaleString('zh-CN',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?0:d});return neg?'-'+s:s}
function wan(n){if(n==null||isNaN(n))return '--';return (n/10000).toFixed(1)+' 万'}
function pct(n){if(n==null||isNaN(n))return '--';return (n*100).toFixed(1)+'%'}
function rb(n){if(n==null||isNaN(n))return '<span class="rb na">--</span>';
  return '<span class="rb '+(n<0.5?'bad':(n<1?'mid':'good'))+'">'+pct(n)+'</span>'}
function clsDif(n){return n==null?'':(n<0?'neg':'pos')}
function dif(v){return '<span'+(v==null?'':' class="'+clsDif(v)+'"')+'>'+fmt(v)+'</span>'}

function loadPrefs(){try{var p=JSON.parse(localStorage.getItem('yj-pct')||'{}');if(p.w)WEEK_PCT=p.w;if(p.d)DAY_PCT=p.d;$('#weekPct').value=WEEK_PCT;$('#dayPct').value=DAY_PCT;}catch(e){}}
function savePrefs(){localStorage.setItem('yj-pct',JSON.stringify({w:WEEK_PCT,d:DAY_PCT}))}

/* ---------- 切片选择 ---------- */
function curSlice(){return (RAW&&RAW.slices)?(RAW.slices[CUR_KEY]||null):null}
function ds(){var s=curSlice();return s?s.companies:{};}
function weekSlice(){return (RAW&&RAW.slices)?(RAW.slices['本周']||null):null}
function daySlice(){return (RAW&&RAW.slices)?(RAW.slices['今日']||null):null}
function totalRow(){return (ds()[CO]||{}).total||{}}
function unitRows(){return (ds()[CO]||{}).units||[]}
function isCurrent(){return CUR_KEY==='本周'||CUR_KEY==='今日'||CUR_KEY===(RAW.meta&&RAW.meta.default_key)}
function unitOf(slice,name){
  if(!slice)return null;
  var c=slice.companies[CO]||{};
  if(name===CO)return c.total||null;
  var u=(c.units||[]).filter(function(x){return x.name===name})[0];
  return u||null;
}
function keyByRange(d1,d2){
  if(!RAW||!RAW.slices)return null;
  var ks=Object.keys(RAW.slices);
  for(var i=0;i<ks.length;i++){var s=RAW.slices[ks[i]];if(s.start===d1&&s.end===d2)return ks[i]}
  return null;
}

/* ---------- KPI ---------- */
function renderKpis(){
  var t=totalRow(),s=curSlice();
  if(!s)return;
  var dl=daySlice();var dt=dl?(dl.companies[CO]||{}).total:null;
  var k=[
    ['月目标',wan(t.target),'¥'+fmt(t.target),'--kpi0'],
    ['区间累计业绩',wan(t.done),'¥'+fmt(t.done,2),'--kpi1'],
    ['目标完成率',pct(t.rate),'目标差距 '+fmt(t.target!=null&&t.done!=null?t.done-t.target:null,0),'--kpi2'],
    ['当日业绩',wan(t.today),'¥'+fmt(t.today,2),'--kpi3'],
    ['高价值客户',fmt(t.hv_d,0)+' / '+fmt(t.hv_t,0),pct(t.hv_rate),'--kpi4'],
    ['业绩同比',t.yoy==null?'--':((t.yoy>=0?'+':'')+(t.yoy*100).toFixed(1)+'%'),'去年同期 ¥'+fmt(t.ly,0),'--kpi5']
  ];
  $('#kpis').innerHTML=k.map(function(x){
    return '<div class="kpi" style="--kc:var('+x[3]+');--kcs:var('+x[3]+'s)"><div class="t">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="s">'+x[2]+'</div></div>';
  }).join('');
}

/* ---------- 主表 ---------- */
function renderMain(){
  var s=curSlice();if(!s)return;
  var rows=unitRows(),t=totalRow();
  var wk=isCurrent()?weekSlice():null,dy=isCurrent()?daySlice():null;
  $('#tblTag').textContent=CO.replace(/公司$/,'')+' · '+s.kind+' '+s.label+'（'+s.start+' ~ '+s.end+'）';
  var h='<thead><tr><th rowspan="2" style="min-width:150px">事业部</th>'+
    '<th colspan="4" class="grp on">业绩完成情况（区间累计）</th>'+
    (wk?'<th colspan="4" class="grp">本周目标完成情况 '+WEEK_PCT+'%</th>':'')+
    (dy?'<th colspan="4" class="grp">当日新增情况 '+DAY_PCT+'%</th>':'')+'</tr>';
  h+='<tr class="sub"><th>目标</th><th>累计业绩</th><th>完成率</th><th>目标差距</th>'+
    (wk?'<th>本周目标</th><th>本周业绩</th><th>完成率</th><th>差额</th>':'')+
    (dy?'<th>当日目标</th><th>当日业绩</th><th>完成率</th><th>差额</th>':'')+'</tr></thead>';

  function rrow(name,g){
    var wt=g.target!=null?g.target*WEEK_PCT/100:null;
    var dt=g.target!=null?g.target*DAY_PCT/100:null;
    var s1='<tr'+(name===CO?' class="total"':'')+'><th>'+esc(name)+'</th>';
    s1+='<td>'+fmt(g.target)+'</td><td>'+fmt(g.done)+'</td><td>'+rb(g.rate)+'</td>'+
        '<td class="'+clsDif(g.done!=null&&g.target!=null?g.done-g.target:null)+'">'+fmt(g.done!=null&&g.target!=null?g.done-g.target:null)+'</td>';
    if(wk){
      var w=unitOf(wk,name)||{};
      var wdone=w.done!=null?w.done:(name===CO?g.today:null);
      var wr=wt?wdone/wt:null;
      s1+='<td>'+fmt(wt)+'</td><td>'+fmt(wdone)+'</td><td>'+rb(wr)+'</td>'+
          '<td class="'+clsDif(wdone!=null&&wt!=null?wdone-wt:null)+'">'+fmt(wdone!=null&&wt!=null?wdone-wt:null)+'</td>';
    }
    if(dy){
      var d=unitOf(dy,name)||{};
      var dd=(d.done!=null?d.done:g.today);
      var dr=dt?dd/dt:null;
      s1+='<td>'+fmt(dt)+'</td><td>'+fmt(dd)+'</td><td>'+rb(dr)+'</td>'+
          '<td class="'+clsDif(dd!=null&&dt!=null?dd-dt:null)+'">'+fmt(dd!=null&&dt!=null?dd-dt:null)+'</td>';
    }
    return s1+'</tr>';
  }
  var body='<tbody>'+rows.map(function(u){return rrow(u.name,u)}).join('');
  body+=rrow(CO,Object.assign({},t))+'</tbody>';
  $('#mainTbl').innerHTML=h+body;
}

/* ---------- 高价值/退款表 ---------- */
function renderHv(){
  var rows=unitRows(),t=totalRow();
  function hrow(name,g){
    return '<tr'+(name===CO?' class="total"':'')+'><th>'+esc(name)+'</th>'+
      '<td>'+fmt(g.hv_t,0)+'</td><td>'+fmt(g.hv_d,0)+'</td><td>'+rb(g.hv_rate)+'</td>'+
      '<td class="neg">'+fmt(g.refund)+'</td><td>'+fmt(g.refund_ly)+'</td><td class="neg">'+fmt(g.refund_today)+'</td>'+
      '<td>'+fmt(g.ly)+'</td><td class="'+clsDif(g.yoy)+'">'+(g.yoy==null?'--':((g.yoy>=0?'+':'')+(g.yoy*100).toFixed(1)+'%'))+'</td></tr>';
  }
  var h='<thead><tr><th rowspan="2">事业部</th><th colspan="3" class="grp">高价值客户</th><th colspan="3" class="grp">退款业绩</th><th colspan="2" class="grp">同比</th></tr>'+
    '<tr class="sub"><th>目标</th><th>完成</th><th>完成率</th><th>月累计</th><th>去年同期</th><th>当日</th><th>去年同期业绩</th><th>业绩同比</th></tr></thead>';
  var b='<tbody>'+rows.map(function(u){return hrow(u.name,u)}).join('')+hrow(CO,t)+'</tbody>';
  $('#hvTbl').innerHTML=h+b;
}

/* ---------- PK ---------- */
function renderPk(){
  var a=$('#pkA').value,b=$('#pkB').value;
  if(!a||!b||a===b){$('#pkBody').innerHTML='<div class="lbl" style="padding:10px 0">请选择两家不同的分公司</div>';return}
  var ca=ds()[a]||{},cb=ds()[b]||{};
  var ta=ca.total||{},tb=cb.total||{};
  var items=[
    ['月目标',ta.target,tb.target],['区间累计业绩',ta.done,tb.done],
    ['目标完成率',ta.rate,tb.rate,'pct'],['当日业绩',ta.today,tb.today],
    ['高价值完成',ta.hv_d,tb.hv_d,'n0'],['业绩同比',ta.yoy,tb.yoy,'pct']
  ];
  var h='<div class="pkhead"><div class="cA">⚔️ '+esc(a)+'</div><div></div><div class="cB">'+esc(b)+'</div><div></div></div>';
  items.forEach(function(it){
    var f=it[3]==='pct'?pct:(it[3]==='n0'?function(v){return fmt(v,0)}:function(v){return fmt(v)});
    var va=it[1],vb=it[2];
    var mx=(it[3]==='pct')?null:Math.max(Math.abs(va||0),Math.abs(vb||0))||1;
    function row(v,cls){var w=it[3]==='pct'?Math.max(2,Math.min(100,Math.abs(v||0)*100)):Math.max(2,Math.abs(v||0)/mx*100);
      return '<div class="pkbar '+cls+'"><div class="nm">'+it[0]+'</div><div class="tr"><div class="fl" style="width:'+w+'%">'+(v==null?'--':f(v))+'</div></div></div>'}
    h+='<div style="margin:6px 0">'+row(va,'pkA')+row(vb,'pkB')+'</div>';
  });
  var names={},list=[];
  (ca.units||[]).forEach(function(u){names[u.name]=1;list.push([u.name,u,null])});
  (cb.units||[]).forEach(function(u){if(!names[u.name]){names[u.name]=1;list.push([u.name,null,u])}else{list.forEach(function(x){if(x[0]===u.name)x[2]=u})}});
  list.sort(function(x,y){return (y[1]?y[1].done:0)-(x[1]?x[1].done:0)});
  var t='<table><thead><tr><th rowspan="2">事业部</th><th colspan="3" class="grp">'+esc(a.replace(/公司$/,''))+'</th><th colspan="3" class="grp">'+esc(b.replace(/公司$/,''))+'</th></tr>'+
    '<tr class="sub"><th>累计业绩</th><th>完成率</th><th>当日</th><th>累计业绩</th><th>完成率</th><th>当日</th></tr></thead><tbody>';
  list.forEach(function(x){
    var A=x[1],B=x[2];
    t+='<tr><th>'+esc(x[0])+'</th>'+
      '<td'+(A&&B&&A.done>(B.done||0)?' style="color:#3f6f9e;font-weight:700"':'')+'>'+fmt(A?A.done:null)+'</td>'+
      '<td>'+(A?rb(A.rate):'--')+'</td><td>'+fmt(A?A.today:null)+'</td>'+
      '<td'+(B&&A&&B.done>(A.done||0)?' style="color:#a8632f;font-weight:700"':'')+'>'+fmt(B?B.done:null)+'</td>'+
      '<td>'+(B?rb(B.rate):'--')+'</td><td>'+fmt(B?B.today:null)+'</td></tr>';
  });
  t+='<tr class="total"><th>公司合计</th><td>'+fmt(ta.done)+'</td><td>'+rb(ta.rate)+'</td><td>'+fmt(ta.today)+'</td>'+
     '<td>'+fmt(tb.done)+'</td><td>'+rb(tb.rate)+'</td><td>'+fmt(tb.today)+'</td></tr></tbody></table>';
  $('#pkBody').innerHTML=h+'<div style="margin-top:12px">'+t+'</div>';
}

/* ---------- 渲染编排 ---------- */
function renderAll(){
  if(!RAW)return;
  renderKpis();renderMain();renderHv();renderPk();
  var s=curSlice(),g=(s&&s.group)||{};
  $('#period').textContent='当前口径：'+s.kind+' '+s.label+'（'+s.start+' ~ '+s.end+'）· 集团完成 '+pct(g.rate)+' · '+CO.replace(/公司$/,'')+'排名 第'+(totalRow().rank||'-')+' 名';
  var notes=(RAW.meta&&RAW.meta.notes)||[];
  $('#noteBox').innerHTML=notes.filter(function(x){return /统计说明|①|②|③/.test(x)}).map(esc).join('<br>');
  $('#footVer').innerHTML='数据更新于 '+((RAW.meta&&RAW.meta.data_time)||'--')+' · 业绩-集团完成情况-分公司（含续费）R-v5 · 每 30 分钟更新数据';
}

function fillSel(el,names,val){
  el.innerHTML=names.map(function(n){return '<option'+(n===val?' selected':'')+'>'+esc(n)+'</option>'}).join('');
}

/* ---------- 口径 / 月份 / 日期 ---------- */
function monthOptions(kind){
  var m=(RAW.meta&&RAW.meta.months)||{};
  return m[kind]||[];
}
function syncMonth(){
  var kind=$('#selType').value;
  var show=(kind==='周期月'||kind==='自然月');
  $('#selMonth').style.display=show?'':'none';
  $('#lblMonth').style.display=show?'':'none';
  if(!show)return;
  var ms=monthOptions(kind);
  var cur=$('#selMonth').value;
  fillSel($('#selMonth'),ms,(cur&&ms.indexOf(cur)>=0)?cur:ms[0]);
  $('#selMonth').value=(cur&&ms.indexOf(cur)>=0)?cur:ms[0];
}
function syncRange(){
  var kind=$('#selType').value,key;
  if(kind==='本周')key='本周';
  else if(kind==='今日')key='今日';
  else key=kind+'|'+$('#selMonth').value;
  var s=RAW.slices[key];
  if(s){$('#d1').value=s.start;$('#d2').value=s.end;}
}
function applyRange(){
  var d1=$('#d1').value,d2=$('#d2').value;
  var hit=keyByRange(d1,d2);
  var wb=$('#warnBox');
  if(hit){
    CUR_KEY=hit;wb.classList.add('hidden');
  }else{
    var key=$('#selType').value;
    if(key==='周期月'||key==='自然月')key=key+'|'+$('#selMonth').value;
    if(RAW.slices[key]){
      CUR_KEY=key;
      var s=RAW.slices[key];
      wb.classList.remove('hidden');
      wb.innerHTML='⚠️ 区间 <b>'+esc(d1)+' ~ '+esc(d2)+'</b> 未在预取范围内（看板每 30 分钟预取：整月 / 本周 / 今日）。'+
        '当前按 <b>'+esc(s.kind+' '+s.label)+'（'+s.start+' ~ '+s.end+'）</b>展示。';
    }else{
      wb.classList.add('hidden');
    }
  }
  renderAll();
}

function applyData(d){
  RAW=d;
  var names=(curSlice()&&curSlice().company_names)||RAW.company_names||[];
  if(!CO||names.indexOf(CO)<0)CO=names.filter(function(n){return /某市/.test(n)})[0]||names[0];
  if(!CUR_KEY||!RAW.slices[CUR_KEY])CUR_KEY=RAW.meta.default_key;
  fillSel($('#selCo'),names,CO);
  $('#selCo').value=CO;
  fillSel($('#pkA'),names,CO);
  fillSel($('#pkB'),names,names.filter(function(n){return /某市/.test(n)})[0]||names[1]||names[0]);
  syncMonth();syncRange();renderAll();
}

var EMBEDDED_DATA=null;
(function(){var el=document.getElementById('embedded-data');
  if(el){try{EMBEDDED_DATA=JSON.parse(el.textContent)}catch(e){}}})();

function fetchData(cb){
  fetch('yj_data.json?v=2ea657bceb').then(function(r){return r.json()}).then(function(d){applyData(d);if(cb)cb()})
    .catch(function(e){if(EMBEDDED_DATA)applyData(EMBEDDED_DATA);else console.error(e)});
}

/* ---------- 事件 ---------- */
$('#selCo').addEventListener('change',function(){CO=this.value;renderAll()});
$('#pkA').addEventListener('change',renderPk);
$('#pkB').addEventListener('change',renderPk);
$('#selType').addEventListener('change',function(){syncMonth();syncRange();applyRange()});
$('#selMonth').addEventListener('change',function(){syncRange();applyRange()});
$('#btnGo').addEventListener('click',applyRange);
$('#btnReset').addEventListener('click',function(){
  $('#selType').value='周期月';syncMonth();
  $('#selMonth').value=monthOptions('周期月')[0]||'';
  syncRange();CUR_KEY=RAW.meta.default_key;syncMonth();syncRange();
  $('#warnBox').classList.add('hidden');renderAll();
});
$('#btnConfirm').addEventListener('click',function(){
  WEEK_PCT=Math.max(1,Math.min(100,+$('#weekPct').value||60));
  DAY_PCT=Math.max(1,Math.min(100,+$('#dayPct').value||10));
  $('#weekPct').value=WEEK_PCT;$('#dayPct').value=DAY_PCT;
  savePrefs();renderAll();toast('目标比例已更新 ✓');
});
$('#btnPk').addEventListener('click',function(){
  var p=$('#pkPanel'),on=p.classList.toggle('hidden');
  $('#mainPanel').classList.toggle('hidden',!on);
  $('#hvPanel').classList.toggle('hidden',!on);
  this.textContent=on?'📊 返回业绩追踪':'⚔️ 业绩 PK';
  if(!on)renderPk();
});
function toast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#4a4166;color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 6px 18px rgba(74,65,102,.32)';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2200);
}

loadPrefs();
fetchData();
setInterval(fetchData,60000);
</script>
